            <div class="tiles">${list.map((s) => `
              <div class="tile ${D.cls(s.status)}">
                <div class="tile-l">${esc(s.label)} · <span class="badge st-${D.cls(s.status)}">${D.SENSOR_LABELS[s.status]}</span></div>
                <div class="tile-v">${s.value == null ? '—' : s.value}${s.value == null || !s.unit ? '' : `<small> ${esc(s.unit)}</small>`}</div>
                ${spark(s)}
                <div class="tile-n">норма ${s.min ?? '—'}–${s.max ?? '—'}${s.time ? ' · ' + U.fmtDT(s.time) : ''}</div>
              </div>`).join('')}</div></article>`;
        }).join('');
        const last = all.reduce((m, s) => (s.time && s.time > m ? s.time : m), '');
        $('meta').textContent = last ? 'последнее показание: ' + U.fmtDT(last) : 'нет показаний';
      }

      // Таблица инцидентов. Для каждой строки: ответственный (выпадающий список рабочих ЭТОЙ зоны + подпись «Участки»), статус
      // (в списке доступны только допустимые следующие шаги — остальные заблокированы), срок и метка «Просрочен» (если не закрыт и срок истёк).
      // Сортировка: незакрытые выше, внутри — по ближайшему сроку. Дедлайн вручную изменить нельзя — он считается автоматически.
      function renderIncidents() {
        const workers = S.users().filter((u) => u.role === 'worker');
        const q = f.q.toLowerCase();
        const rows = S.listIncidents()
          .filter((i) => (!f.status || i.status === f.status) && (!f.location || i.location === f.location) && (!f.type || i.type === f.type) &&
            (!q || (i.incident_id + ' ' + i.description).toLowerCase().includes(q)))
          .sort((a, b) => (a.status === 'CLOSED') - (b.status === 'CLOSED') || new Date(a.deadline) - new Date(b.deadline));
        if (!rows.length) { $('incidents').innerHTML = '<div class="empty">Нет инцидентов по заданным фильтрам</div>'; return; }
        $('incidents').innerHTML = `<table class="tbl"><thead><tr>
          <th>ID</th><th>Тип</th><th>Участок</th><th>Создан</th><th>Ответственный</th><th>Статус</th><th>Deadline</th><th></th></tr></thead><tbody>
          ${rows.map((i) => {
            const idx = D.STATUSES.indexOf(i.status);
            const closed = i.status === 'CLOSED';
            const overdue = S.isOverdue(i);
            const resp = workers.filter((w) => (w.active && S.userHasZone(w, i.location)) || w.id === i.responsible);
            return `<tr class="${overdue ? 'row-overdue' : ''} ${closed ? 'row-closed' : ''}">
              <td><b>${esc(i.incident_id)}</b>${i.source === 'auto' ? ' <span class="chip warn" title="Создан автоматически (A-3)">авто</span>' : ''}${i.related_to ? `<div class="small muted">повтор по ${esc(i.related_to)}</div>` : ''}</td>
              <td><span class="chip t-${i.type}">${esc(D.TYPES[i.type] || i.type)}</span></td>
              <td title="${esc(S.locName(i.location))}">${esc(i.location)}<div class="small muted">${esc(D.zoneLabel(S.zoneOf(i.location)))}</div></td>
              <td class="nowrap">${U.fmtDT(i.time)}</td>
              <td><select data-act="assign" data-id="${i.incident_id}" ${closed || i.status === 'IN_PROGRESS' ? 'disabled' : ''}>
                <option value="" ${i.status === 'NEW' ? '' : 'disabled'}>— не назначен —</option>
                ${resp.map((w) => `<option value="${w.id}" ${w.id === i.responsible ? 'selected' : ''}>${esc(w.name)} · ${esc(S.sitesLabel(w))}</option>`).join('')}</select>
                ${i.responsible ? `<div class="small muted">Участки: ${esc(S.sitesLabel(S.users().find((u) => u.id === i.responsible)))}</div>` : ''}</td>
              <td><select class="st st-${i.status.toLowerCase()}" data-act="status" data-id="${i.incident_id}" ${closed ? 'disabled' : ''}>
                ${D.STATUSES.map((s, n) => `<option value="${s}" ${s === i.status ? 'selected' : ''} ${n !== idx && n !== idx + 1 ? 'disabled' : ''}>${D.STATUS_LABELS[s]}</option>`).join('')}</select></td>
              <td class="nowrap">${U.fmtDT(i.deadline)}${overdue ? ' <span class="badge st-critical" title="Срок 4 часа истёк, инцидент не закрыт">Просрочен</span>' : ''}
                <div class="small ${overdue ? 'bad-t' : 'muted'}">${closed ? 'закрыт' : U.relative(i.deadline)}</div></td>
              <td><button class="btn ghost sm" data-act="open" data-id="${i.incident_id}" title="Описание и комментарии">💬 ${S.comments(i.incident_id).length}</button>${closed && S.can('incident.create') ? ` <button class="btn ghost sm" data-act="followup" data-id="${i.incident_id}" title="Закрытый инцидент не открывается заново — создаётся новый">↻ Новый</button>` : ''}</td>
            </tr>`;
          }).join('')}</tbody></table>`;
      }

      // Таблица показаний датчиков с фильтрами
      function renderReadings() {
        const rows = S.readings()
          .filter((r) => (!rf.location || r.location === rf.location) && (!rf.indicator || r.indicator === rf.indicator) && (!rf.status || r.status === rf.status))
          .sort((a, b) => b.time.localeCompare(a.time));
        if (!rows.length) { $('readings').innerHTML = '<div class="empty">Нет показаний по заданным фильтрам</div>'; return; }
        $('readings').innerHTML = `<table class="tbl"><thead><tr><th>Время</th><th>Участок</th><th>Показатель</th><th>Значение</th><th>Норма</th><th>Статус</th></tr></thead><tbody>
          ${rows.map((r) => {
            const th = S.thresholds()[r.indicator] || { unit: '' };
            return `<tr class="${r.status === 'CRITICAL' ? 'row-overdue' : r.status === 'WARNING' ? 'row-warn' : (r.status === 'STALE' || r.status === 'DUPLICATE') ? 'row-closed' : ''}">
              <td class="nowrap">${U.fmtDT(r.time)}</td><td>${esc(r.location)}</td><td>${esc(D.indLabel(r.indicator))}</td>
              <td><b>${fmtV(r.value, th.unit)}</b></td><td class="muted">${r.norm_min}–${r.norm_max}</td>
              <td><span class="badge st-${D.cls(r.status)}">${D.SENSOR_LABELS[r.status] || esc(r.status)}</span></td></tr>`;
          }).join('')}</tbody></table>`;
      }

      // Блок эскалаций A-4 (виден руководителю)
      function renderEsc() {
        const el = $('esc');
        if (!S.can('escalations.view')) { el.style.display = 'none'; return; }
        const list = S.escalations();
        el.innerHTML = `<div class="panel-h"><h2>Эскалации руководителю (A-4)</h2><span class="muted">${list.filter((x) => !x.ack).length} без подтверждения</span></div>` +
          (list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Время</th><th>Участок</th><th>Показатель</th><th>Причина</th><th>Адресат</th><th></th></tr></thead><tbody>${list.map((x) => `<tr class="${x.ack ? 'row-closed' : 'row-warn'}"><td><b>${esc(x.escalation_id)}</b></td><td class="nowrap">${U.fmtDT(x.time)}</td><td>${esc(x.location)}</td><td>${esc(D.indLabel(x.indicator))}</td><td>${esc(x.reason)}</td><td>${esc(x.to.map((id) => S.userName(id)).join(', '))}</td><td>${x.ack ? '✔ принята' : `<button class="btn sm" data-act="ack" data-id="${x.escalation_id}">Подтвердить</button>`}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Эскалаций нет</div>');
      }

      // Последние 30 записей аудита (виден руководителю)
      function renderAudit() {
        const el = $('audit');
        if (!S.can('audit.view')) { el.style.display = 'none'; return; }
        const rows = S.auditLog().slice(-30).reverse();
        el.innerHTML = `<div class="panel-h"><h2>Журнал аудита <span class="muted small">(последние 30, append-only)</span></h2></div><div class="table-wrap tall"><table class="tbl"><thead><tr><th>ID</th><th>Объект</th><th>Действие</th><th>Статус</th><th>Кто</th><th>Когда</th><th>IP</th></tr></thead><tbody>${rows.map((a) => `<tr><td>${esc(a.event_id)}</td><td>${esc(a.entity_type)} <b>${esc(a.entity_id)}</b></td><td><span class="chip">${esc(a.action)}</span></td><td class="nowrap">${esc(a.from_status || '—')} → ${esc(a.to_status || '—')}</td><td>${esc(a.actor)}</td><td class="nowrap">${U.fmtDT(a.at)}</td><td>${esc(a.ip)}</td></tr>`).join('')}</tbody></table></div>`;
      }

      // Окно инцидента: описание и комментарии
      function renderDetails() {
        const dlg = $('dlg');
        if (!openId) return;
        const i = S.listIncidents().find((x) => x.incident_id === openId);
        if (!i) return;
        dlg.innerHTML = `<form method="dialog" class="dlg-body">
          <h3>${esc(i.incident_id)} · ${esc(D.TYPES[i.type] || i.type)} · ${esc(i.location)}</h3>
          <p>${esc(i.description || 'Описание не указано')}</p>
          <p class="muted small">${esc(S.locName(i.location))} · Создан ${U.fmtDT(i.time)} · Ответственный: ${esc(S.userName(i.responsible))}${i.responsible ? ' (участки: ' + esc(S.sitesLabel(S.users().find((u) => u.id === i.responsible))) + ')' : ''} · Срок: ${U.fmtDT(i.deadline)} · Статус: ${D.STATUS_LABELS[i.status]}</p>
          <div class="comments">${S.comments(i.incident_id).map((c) => `<div class="cmt"><b>${esc(S.userName(c.user_id))}</b> <span class="muted small">${U.fmtDT(c.time)}</span><div>${esc(c.text)}</div></div>`).join('') || '<div class="muted">Комментариев пока нет</div>'}</div>
          <textarea data-role="cmt" rows="2" placeholder="Комментарий диспетчера…"></textarea>
          <div class="dlg-actions"><button class="btn primary" type="button" data-act="cmt" data-id="${i.incident_id}">Добавить</button><button class="btn ghost" value="close">Закрыть</button></div></form>`;
      }

      // Окно «Новый инцидент»: тип, участок (только из доступных зон), ответственный (необязательно), описание.
      // Полей времени и срока нет НАМЕРЕННО: время создания и дедлайн (+4 часа) ставит система по своим часам.
      function openCreate() {
        const dlg = $('dlg');
        openId = null;
        dlg.innerHTML = `<form method="dialog" class="dlg-body">
          <h3>Новый инцидент</h3>
          <label>Тип<select data-role="c-type">${Object.entries(D.TYPES).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
          <label>Участок<select data-role="c-loc">${S.visibleLocations().map((l) => `<option value="${l.id}">${l.id} — ${esc(l.name)}</option>`).join('')}</select></label>
          <label>Ответственный<select data-role="c-resp"><option value="">— назначить позже —</option>${S.users().filter((u) => u.role === 'worker' && u.active).map((w) => `<option value="${w.id}">${esc(w.name)} · ${esc(S.sitesLabel(w))}</option>`).join('')}</select></label>
          <p class="muted small">Время создания и срок устранения задаются автоматически: срок = время создания + 4 часа (по времени системы).</p>
          <label>Описание<textarea data-role="c-desc" rows="2"></textarea></label>
          <div class="dlg-actions"><button class="btn primary" type="button" data-act="create">Создать</button><button class="btn ghost" value="close">Отмена</button></div></form>`;
        dlg.showModal();
      }

      const safe = (fn) => (e) => {
        try { fn(e); } catch (err) { U.toast(err.message, 'error'); renderIncidents(); renderKpi(); }
      };

      root.addEventListener('click', safe((e) => {
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const act = b.dataset.act, id = b.dataset.id;
        if (act === 'new') openCreate();
        else if (act === 'clear') { Object.assign(f, { status: '', location: '', type: '', q: '' }); renderFilters(); renderIncidents(); }
        else if (act === 'open') { openId = id; renderDetails(); $('dlg').showModal(); }
        else if (act === 'ack') { S.ackEscalation(id); U.toast('Эскалация подтверждена', 'ok'); }
        else if (act === 'followup') { const n = S.createFollowUp(id); U.toast(`Создан ${n.incident_id} (повтор по ${id})`, 'ok'); }
        else if (act === 'cmt') {
          const t = $('dlg').querySelector('[data-role="cmt"]');
          S.addComment(id, t.value);
          U.toast('Комментарий добавлен', 'ok');
        } else if (act === 'create') {
          const g = (n) => $('dlg').querySelector(`[data-role="${n}"]`).value;
          const inc = S.createIncident({ type: g('c-type'), location: g('c-loc'), responsible: g('c-resp'), description: g('c-desc') });
          $('dlg').close();
          U.toast(`Создан ${inc.incident_id}`, 'ok');
        }
      }));
      root.addEventListener('change', safe((e) => {
        const t = e.target;
        if (t.dataset.f) { f[t.dataset.f] = t.value; renderIncidents(); return; }
        if (t.dataset.rf) { rf[t.dataset.rf] = t.value; renderReadings(); return; }
        if (t.dataset.act === 'assign') { S.assign(t.dataset.id, t.value); U.toast('Ответственный обновлён', 'ok'); }
        else if (t.dataset.act === 'status') { S.changeStatus(t.dataset.id, t.value); U.toast('Статус изменён', 'ok'); }
      }));
      root.addEventListener('input', (e) => { if (e.target.dataset.f === 'q') { f.q = e.target.value; renderIncidents(); } });
      $('dlg').addEventListener('close', () => { openId = null; });

      renderFilters(); renderKpi(); renderAlerts(); renderSensors(); renderIncidents(); renderReadings(); renderEsc(); renderAudit();
      container.appendChild(root);

      return {
        refresh(topic) {
          if (topic === 'incidents') { renderIncidents(); renderKpi(); renderDetails(); renderAudit(); }
          else if (topic === 'telemetry') { renderSensors(); renderAlerts(); renderReadings(); renderKpi(); renderEsc(); renderAudit(); renderIncidents(); }
          else if (topic === 'directory' || topic === 'admin') { renderFilters(); renderSensors(); renderAlerts(); renderIncidents(); renderReadings(); renderKpi(); renderEsc(); renderAudit(); }
        },
      };
    },
  };
})();

/* ===== js/views/manager.js ===== */
(function () { SC.views.manager = SC.views.dispatcher; })(); // руководитель = экран диспетчера + эскалации и аудит

/* ===== js/views/worker.js ===== */
(function () {
  const SC = window.SC, U = SC.utils, D = SC.data, S = SC.store;
  const V = (SC.views = SC.views || {});
  const esc = U.esc;

  // ЭКРАН РАБОЧЕГО. Видны только задачи, назначенные ему. Действия: «Принять в работу» (только ASSIGNED и только пока срок не истёк),
  // комментарий, «Выполнено» (из «В работе»). Просроченная задача берётся только через диспетчера — вместо кнопки показывается пояснение.
  V.worker = {
    mount(container) {
      const root = document.createElement('div');
      root.className = 'view worker';
      const me = S.currentUser();
      let tab = 'active';
      const drafts = {};

      root.innerHTML = `
        <section class="panel hello"><div><h2>Здравствуйте, ${esc(me.name)}</h2><div class="muted">${esc(me.name)} · ID ${esc(me.id)} · Отвечает за участки: <b>${esc(S.sitesLabel(me))}</b></div></div>
          <div class="tabs" data-sec="tabs"></div></section>
        <section class="cards" data-sec="cards"></section>`;
      const $ = (n) => root.querySelector(`[data-sec="${n}"]`);

      // Отрисовка карточек задач рабочего + баннер просроченных задач
      function render() {
        const mine = S.listIncidents();
        const act = mine.filter((i) => i.status !== 'CLOSED');
        const done = mine.filter((i) => i.status === 'CLOSED');
        $('tabs').innerHTML = `<button class="tab ${tab === 'active' ? 'on' : ''}" data-tab="active">Активные (${act.length})</button><button class="tab ${tab === 'done' ? 'on' : ''}" data-tab="done">Выполненные (${done.length})</button>`;
        const list = (tab === 'active' ? act : done).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
        if (!list.length) { $('cards').innerHTML = `<div class="empty big">${tab === 'active' ? '🎉 Активных задач нет' : 'Выполненных задач пока нет'}</div>`; return; }
        const late = act.filter(S.isOverdue);
        const banner = late.length ? `<div class="alert-banner" style="grid-column:1/-1"><div class="alert-title"><span class="pulse"></span>Просрочено задач: ${late.length}</div><ul>${late.map((i) => `<li><b>${esc(i.incident_id)}</b> · ${esc(i.location)} <span class="muted">(срок был ${U.fmtDT(i.deadline)})</span></li>`).join('')}</ul></div>` : '';
        $('cards').innerHTML = banner + list.map((i) => {
          const overdue = S.isOverdue(i);
          const cm = S.comments(i.incident_id);
          const canTake = i.status === 'ASSIGNED' && !overdue; // NEW → IN_PROGRESS напрямую запрещён; просроченную задачу взять нельзя (см. S.changeStatus)
          return `<article class="card ${overdue ? 'overdue' : ''}" data-id="${i.incident_id}">
            <header><b>${esc(i.incident_id)}</b><span class="chip t-${i.type}">${esc(D.TYPES[i.type] || i.type)}</span><span class="badge st-${i.status.toLowerCase()}">${D.STATUS_LABELS[i.status]}</span></header>
            <div class="card-loc">📍 ${esc(i.location)} · ${esc(S.locName(i.location))}</div>
            <p>${esc(i.description || D.TYPES[i.type] || i.type)}</p>
            <div class="small muted">Создан: ${U.fmtDT(i.time)}</div>
            <div class="small ${overdue ? 'bad-t' : 'muted'}">Срок: ${U.fmtDT(i.deadline)} · ${i.status === 'CLOSED' ? 'выполнено' : U.relative(i.deadline)}</div>
            <div class="comments">${cm.map((c) => `<div class="cmt"><b>${esc(S.userName(c.user_id))}</b> <span class="muted small">${U.fmtDT(c.time)}</span><div>${esc(c.text)}</div></div>`).join('')}</div>
            ${i.status !== 'CLOSED' ? `<textarea rows="2" data-draft="${i.incident_id}" placeholder="Комментарий к работе, например: «Проверен участок ${esc(i.location)}»">${esc(drafts[i.incident_id] || '')}</textarea>
            <div class="card-actions">
              <button class="btn" data-act="cmt" data-id="${i.incident_id}">Добавить комментарий</button>
              ${canTake ? `<button class="btn primary" data-act="take" data-id="${i.incident_id}">▶ Принять в работу</button>` : ''}
              ${i.status === 'ASSIGNED' && overdue ? '<div class="small bad-t">⛔ Срок истёк — взять задачу в работу нельзя, сообщите диспетчеру</div>' : ''}
              ${i.status === 'IN_PROGRESS' ? `<button class="btn success" data-act="close" data-id="${i.incident_id}">✔ Выполнено</button>` : ''}
            </div>` : ''}
          </article>`;
        }).join('');
      }

      const safe = (fn) => (e) => { try { fn(e); } catch (err) { U.toast(err.message, 'error'); render(); } };
      root.addEventListener('input', (e) => { if (e.target.dataset.draft) drafts[e.target.dataset.draft] = e.target.value; });
      root.addEventListener('click', safe((e) => {
        const t = e.target.closest('[data-tab]');
        if (t) { tab = t.dataset.tab; render(); return; }
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const id = b.dataset.id;
        if (b.dataset.act === 'take') { S.changeStatus(id, 'IN_PROGRESS'); U.toast('Задача принята в работу', 'ok'); }
        else if (b.dataset.act === 'close') {
          if (drafts[id] && drafts[id].trim()) { S.addComment(id, drafts[id]); delete drafts[id]; }
          S.changeStatus(id, 'CLOSED');
          U.toast('Задача отмечена выполненной', 'ok');
        } else if (b.dataset.act === 'cmt') { S.addComment(id, drafts[id]); delete drafts[id]; U.toast('Комментарий сохранён', 'ok'); }
      }));

      render();
      container.appendChild(root);
      return { refresh(topic) { if (topic === 'incidents' || topic === 'telemetry' || topic === 'admin') render(); } };
    },
  };
})();

/* ===== js/views/admin.js ===== */
(function () {
  const SC = window.SC, U = SC.utils, D = SC.data, S = SC.store;
  const V = (SC.views = SC.views || {});
  const esc = U.esc;

  // ЭКРАН АДМИНИСТРАТОРА: вкладки «Пользователи», «Справочники» (участки, нормы), «Системные логи» (+ проверка RBAC),
  // «Аудит» (проверка цепочки хэшей, экспорт, попытка подделки), «Реестр данных» (содержимое CSV, экспорт, импорт, сброс).
  V.admin = {
    mount(container) {
      const root = document.createElement('div');
      root.className = 'view admin';
      let tab = 'users', regTab = 'incidents';
      const TABS = [['users', '👥 Пользователи'], ['dirs', '🗂 Справочники'], ['logs', '📜 Системные логи'], ['audit', '🧾 Аудит'], ['registry', '🗃 Реестр данных']];
      root.innerHTML = `<div class="tabs big" data-sec="tabs"></div><section class="panel" data-sec="body"></section><dialog data-sec="dlg"></dialog>`;
      const $ = (n) => root.querySelector(`[data-sec="${n}"]`);

      const tabs = () => ($('tabs').innerHTML = TABS.map(([k, t]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join(''));

      // Вкладка «Пользователи»
      function users() {
        return `<div class="panel-h"><h2>Учётные записи</h2><button class="btn primary" data-act="user-new">+ Добавить сотрудника</button></div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>ФИО</th><th>Логин</th><th>Роль</th><th>Зоны</th><th>Участки</th><th>Статус</th><th></th></tr></thead><tbody>
        ${S.users().map((u) => `<tr class="${u.active ? '' : 'row-closed'}"><td><b>${u.id}</b></td><td class="nowrap">${esc(u.name)}</td><td>${esc(u.login)}</td>
          <td><span class="chip role-${u.role}">${D.ROLES[u.role]}</span></td><td>${esc(S.zonesLabel(u))}</td><td>${esc(S.sitesLabel(u))}</td><td>${u.active ? 'активен' : 'отключён'}</td>
          <td><button class="btn ghost sm" data-act="user-edit" data-id="${u.id}">Изменить</button></td></tr>`).join('')}</tbody></table></div>
        <p class="muted small">Идентификаторы рабочих e_101…e_105 взяты из incidents.csv. ФИО (с отчествами) в файлах отсутствуют — это условные данные, их можно отредактировать. Участки рабочих определены по incidents.csv (responsible → location).</p>`;
      }

      // Вкладка «Справочники»: участки и нормы датчиков
      function dirs() {
        const th = S.thresholds();
        return `<div class="grid2">
          <div><div class="panel-h"><h2>Участки (sites.csv)</h2></div>
            <table class="tbl"><thead><tr><th>Код</th><th>Название</th><th>Зона</th></tr></thead><tbody>${S.locations().map((l) => `<tr><td><b>${esc(l.id)}</b></td><td>${esc(l.name)}</td><td>${esc(l.zone || '—')}</td></tr>`).join('')}</tbody></table>
            <div class="inline-form"><input data-role="loc-id" value="${S.nextLocationId()}" size="8"><input data-role="loc-name" placeholder="Название участка"><input data-role="loc-zone" placeholder="zone_D" size="8"><button class="btn primary" data-act="loc-add">Добавить участок</button></div>
            <p class="muted small">У нового участка до появления показаний датчики отображаются как «нет данных».</p></div>
          <div><div class="panel-h"><h2>Нормы датчиков (из indicators.csv)</h2></div>
            <table class="tbl"><thead><tr><th>Показатель</th><th>norm_min</th><th>norm_max</th><th>Ед.</th></tr></thead><tbody>
            ${Object.entries(th).map(([k, t]) => `<tr><td><b>${esc(t.label)}</b> <span class="muted small">${k}</span></td><td>${t.min ?? '—'}</td><td>${t.max ?? '—'}</td><td>${esc(t.unit || '—')}</td></tr>`).join('')}</tbody></table>
            <p class="muted small">Нормы и статусы показаний берутся из файла indicators.csv и в сервисе не редактируются.</p></div></div>`;
      }

      // Вкладка «Системные логи» (+ проверка RBAC)
      function logs() {
        const rows = S.logs();
        return `<div class="panel-h"><h2>Системный журнал <span class="muted small">(последние ${rows.length})</span></h2>
          <button class="btn ghost" data-act="rbac-test" title="Попытаться выполнить действия диспетчера под ролью администратора">🛡 Проверить RBAC</button></div>
          <div class="table-wrap tall"><table class="tbl"><thead><tr><th>Время</th><th>Пользователь</th><th>Роль</th><th>Действие</th><th>Детали</th></tr></thead><tbody>
          ${rows.map((l) => `<tr class="${l.level === 'WARN' ? 'row-warn' : ''}"><td class="nowrap">${U.fmtDT(l.time)}</td><td>${esc(l.user)}</td><td>${esc(D.ROLES[l.role] || l.role)}</td><td><span class="chip ${l.level === 'WARN' ? 'warn' : ''}">${esc(l.action)}</span></td><td>${esc(l.details)}</td></tr>`).join('')}</tbody></table></div>`;
      }

      // Вкладка «Аудит»: проверка цепочки, экспорт, попытка подделки
      function audit() {
        const all = S.auditLog(), v = S.verifyAudit(), rows = all.slice(-300).reverse();
        return `<div class="panel-h"><h2>Журнал аудита <span class="muted small">(append-only · ${all.length} записей, показаны последние ${rows.length})</span></h2><div class="btns">
          <button class="btn ghost" data-act="aud-verify">🔗 Проверить цепочку хэшей</button><button class="btn ghost" data-act="aud-tamper">🛡 Попытка изменить/удалить</button><button class="btn ghost" data-act="aud-exp">⬇ audit.csv</button></div></div>
          <div class="${v.ok ? 'alert-ok' : 'alert-banner'}" style="margin-bottom:12px">${v.ok ? '✔ Цепочка хэшей целостна' : '✖ Нарушена цепочка на записи №' + (v.at + 1)}</div>
          <div class="table-wrap tall"><table class="tbl"><thead><tr><th>event_id</th><th>Объект</th><th>Действие</th><th>from → to</th><th>actor</th><th>at</th><th>ip</th><th>Детали</th></tr></thead><tbody>
          ${rows.map((x) => `<tr><td>${esc(x.event_id)}</td><td>${esc(x.entity_type)} <b>${esc(x.entity_id)}</b></td><td><span class="chip">${esc(x.action)}</span></td><td class="nowrap">${esc(x.from_status || '—')} → ${esc(x.to_status || '—')}</td><td>${esc(x.actor)}</td><td class="nowrap">${U.fmtDT(x.at)}</td><td>${esc(x.ip)}</td><td class="muted">${esc(x.details)}</td></tr>`).join('')}</tbody></table></div>
          <p class="muted small">IP в прототипе условные (в браузере реальный адрес недоступен). На сервере (backend/sc_backend.py) записывается адрес клиента.</p>`;
      }

      // Вкладка «Реестр данных»: содержимое CSV, экспорт, импорт, сброс
      function registry() {
        const reg = S.registry();
        const head = `<div class="panel-h"><h2>Общий реестр данных</h2><div class="btns">
          <button class="btn ghost" data-act="exp-inc">⬇ incidents.csv</button><button class="btn ghost" data-act="exp-ind">⬇ indicators.csv</button><button class="btn ghost" data-act="exp-sites">⬇ sites.csv</button>
          <label class="btn ghost">⬆ Импорт incidents.csv<input type="file" accept=".csv,text/csv" data-role="imp" hidden></label>
          <button class="btn danger" data-act="reset">Сбросить к данным из файлов</button></div></div>
          <div class="tabs"><button class="tab ${regTab === 'incidents' ? 'on' : ''}" data-reg="incidents">incidents (${reg.incidents.length})</button><button class="tab ${regTab === 'indicators' ? 'on' : ''}" data-reg="indicators">indicators (${reg.readings.length})</button></div>`;
        const body = regTab === 'incidents'
          ? `<div class="table-wrap tall"><table class="tbl"><thead><tr><th>incident_id</th><th>type</th><th>location</th><th>time</th><th>responsible</th><th>status</th><th>deadline</th></tr></thead><tbody>
            ${reg.incidents.map((i) => `<tr><td>${esc(i.incident_id)}</td><td>${esc(i.type)}</td><td>${esc(i.location)}</td><td class="nowrap">${U.fmtDT(i.time)}</td><td>${esc(i.responsible || '—')}</td><td><span class="badge st-${i.status.toLowerCase()}">${i.status}</span></td><td class="nowrap">${U.fmtDT(i.deadline)}</td></tr>`).join('')}</tbody></table></div>`
          : `<div class="table-wrap tall"><table class="tbl"><thead><tr><th>time</th><th>location</th><th>indicator</th><th>value</th><th>norm_min</th><th>norm_max</th><th>status</th></tr></thead><tbody>
            ${reg.readings.map((r) => `<tr><td class="nowrap">${U.fmtDT(r.time)}</td><td>${esc(r.location)}</td><td>${esc(r.indicator)}</td><td>${r.value == null ? '—' : r.value}</td><td>${r.norm_min}</td><td>${r.norm_max}</td><td><span class="badge st-${D.cls(r.status)}">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table></div>`;
        return head + body;
      }

      // Перерисовка вкладок админки
      function render() {
        tabs();
        $('body').innerHTML = { users, dirs, logs, audit, registry }[tab]();
      }

      // Форма создания/редактирования сотрудника
      function userDialog(id) {
        const u = id ? S.users().find((x) => x.id === id) : { name: '', login: '', role: 'worker', active: true, zones: [], sites: [] };
        $('dlg').innerHTML = `<form method="dialog" class="dlg-body">
          <h3>${id ? 'Редактирование ' + esc(u.id) : 'Новый сотрудник'}</h3>
          <label>ФИО (Фамилия Имя Отчество)<input data-role="u-name" value="${esc(u.name)}"></label>
          <label>Логин<input data-role="u-login" value="${esc(u.login)}"></label>
          <label>Роль<select data-role="u-role">${Object.entries(D.ROLES).map(([k, t]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
          <label>Зоны (zone_A, zone_B… или *; у руководителя и админа — все)<input data-role="u-zones" value="${esc(u.zones === '*' ? '*' : (u.zones || []).join(', '))}"></label>
          <label>Участки, за которые отвечает (site_01, site_02… или *; должны входить в зоны)<input data-role="u-sites" value="${esc(u.sites === '*' ? '*' : (u.sites || []).join(', '))}"></label>
          <label class="check"><input type="checkbox" data-role="u-act" ${u.active ? 'checked' : ''}> Учётная запись активна</label>
          <div class="dlg-actions"><button class="btn primary" type="button" data-act="user-save" data-id="${id || ''}">Сохранить</button><button class="btn ghost" value="close">Отмена</button></div></form>`;
        $('dlg').showModal();
      }

      const safe = (fn) => (e) => { try { fn(e); } catch (err) { U.toast(err.message, 'error'); render(); } };
      const val = (n) => root.querySelector(`[data-role="${n}"]`).value;

      root.addEventListener('click', safe((e) => {
        const t = e.target.closest('[data-tab]');
        if (t) { tab = t.dataset.tab; render(); return; }
        const r = e.target.closest('[data-reg]');
        if (r) { regTab = r.dataset.reg; render(); return; }
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const id = b.dataset.id;
        switch (b.dataset.act) {
          case 'user-new': userDialog(); break;
          case 'aud-verify': { const v = S.verifyAudit(); U.toast(v.ok ? `Цепочка целостна: ${v.total} записей` : `НАРУШЕНИЕ на записи №${v.at + 1}`, v.ok ? 'ok' : 'error'); render(); break; }
          case 'aud-exp': U.download('audit.csv', S.exportAuditCSV()); break;
          case 'aud-tamper': {
            const first = S.auditLog()[0];
            const tries = [['Изменить', () => S.auditUpdate()], ['Удалить', () => S.auditDelete()]];
            const res = tries.map(([n, f]) => { try { f(); return n + ': выполнено?!'; } catch (er) { return n + ': ' + (er.code === 'AUDIT_APPEND_ONLY' ? 'отказ ✔' : 'ошибка'); } });
            res.push('Запись заморожена: ' + (Object.isFrozen(first) ? 'да ✔' : 'НЕТ'));
            U.toast('Аудит: ' + res.join(' | '), 'info'); break;
          }
          case 'user-edit': userDialog(id); break;
          case 'user-save':
            S.saveUser({ id: id || undefined, name: val('u-name'), login: val('u-login'), role: val('u-role'), zones: val('u-zones'), sites: val('u-sites'), active: root.querySelector('[data-role="u-act"]').checked });
            $('dlg').close(); U.toast('Пользователь сохранён', 'ok'); break;
          case 'loc-add': S.addLocation(val('loc-id'), val('loc-name'), val('loc-zone')); U.toast('Участок добавлен', 'ok'); break;
          case 'exp-inc': U.download('incidents.csv', S.exportIncidentsCSV()); break;
          case 'exp-ind': U.download('indicators.csv', S.exportIndicatorsCSV()); break;
          case 'exp-sites': U.download('sites.csv', S.exportSitesCSV()); break;
          case 'reset': if (confirm('Сбросить рабочие данные и загрузить заново из файлов?')) { S.resetData(); U.toast('Данные восстановлены из файлов', 'ok'); } break;
          case 'rbac-test': {
            const tries = [['Смена статуса инцидента', () => S.changeStatus('inc_001', 'ASSIGNED')], ['Создание инцидента', () => S.createIncident({})], ['Назначение ответственного', () => S.assign('inc_001', 'e_101')]];
            const res = tries.map(([n, f]) => { try { f(); return n + ': выполнено?!'; } catch (er) { return n + ': ' + (er instanceof S.AccessError ? 'отказ ✔' : 'ошибка'); } });
            U.toast('RBAC: ' + res.join(' | '), 'info'); break;
          }
        }
      }));
      root.addEventListener('change', safe((e) => {
        if (e.target.dataset.role === 'imp' && e.target.files[0]) {
          const file = e.target.files[0];
          const rd = new FileReader();
          rd.onload = () => { try { const r = S.importIncidentsCSV(String(rd.result)); U.toast(`Импорт: +${r.added}, обновлено ${r.updated}, пропущено ${r.skipped}`, 'ok'); } catch (er) { U.toast(er.message, 'error'); } };
          rd.readAsText(file);
        }
      }));

      render();
      container.appendChild(root);
      return {
        refresh(topic) {
          if (['logs', 'incidents', 'telemetry', 'admin', 'directory'].includes(topic)) {
            if (tab === 'dirs' && topic !== 'directory' && topic !== 'admin') return;
            if (tab === 'users' && topic !== 'admin') return;
            if (topic === 'logs' && tab !== 'logs') return;
            render();
          }
        },
      };
    },
  };
})();

/* ===== js/app.js ===== */
(function () {
  const SC = window.SC, U = SC.utils, D = SC.data, S = SC.store;
  const header = document.getElementById('app-header');
  const main = document.getElementById('app-main');
  let current = null;

  const ICON = { dispatcher: '🖥', manager: '📊', worker: '🧰', admin: '⚙' };

  // Шапка приложения: логотип, переключатель ролей, выбор пользователя (с зонами и участками), кнопка «Стенд датчиков»,
  // часы системы и ПАНЕЛЬ СИМУЛЯЦИИ: ▶/⏸, «в начало», −1 ч / −10 мин / +10 мин / +1 ч, скорость (×1…×1800) и ползунок позиции.
  function renderHeader() {
    const s = S.session();
    const same = S.users().filter((u) => u.role === s.role && u.active);
    header.innerHTML = `
      <div class="brand"><span class="logo">🐔</span><div><b>Ситуационный центр</b><small>Птицеводческое предприятие · прототип</small></div></div>
      <nav class="roles" aria-label="Переключатель ролей">
        ${Object.entries(D.ROLES).map(([k, t]) => `<button class="role-btn ${s.role === k ? 'on' : ''}" data-role="${k}">${ICON[k]} ${t}</button>`).join('')}
      </nav>
      <div class="hdr-right">
        <label class="who">Пользователь:
          <select data-user>${same.map((u) => `<option value="${u.id}" ${u.id === s.userId ? 'selected' : ''}>${U.esc(u.name)} · ${U.esc(S.zonesLabel(u))} · ${U.esc(S.sitesLabel(u))}</option>`).join('')}</select></label>
        <button class="btn ghost sm" data-stand>📡 Стенд датчиков</button>
        <span class="clock" id="clock" title="Время системы: симулируемое, старт — время первого инцидента в данных"></span>
      </div>
      <div class="simbar" aria-label="Управление симуляцией">
        <button class="btn ghost sm" data-sim>${S.simRunning ? '⏸ Симуляция' : '▶ Симуляция'}</button>
        <button class="btn ghost sm" data-seek="start" title="В начало (время первого инцидента)">⏮</button>
        <button class="btn ghost sm" data-seek="-3600000" title="Назад на 1 час">−1 ч</button>
        <button class="btn ghost sm" data-seek="-600000" title="Назад на 10 минут">−10 мин</button>
        <button class="btn ghost sm" data-seek="600000" title="Вперёд на 10 минут">+10 мин</button>
        <button class="btn ghost sm" data-seek="3600000" title="Вперёд на 1 час">+1 ч</button>
        <label>Скорость <select data-speed>${[[1, '×1'], [10, '×10'], [60, '×60 (1 с = 1 мин)'], [300, '×300 (1 с = 5 мин)'], [1800, '×1800 (1 с = 30 мин)']].map(([k, t]) => `<option value="${k}" ${U.speed() === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <span class="sim-r" data-sim-a></span>
        <input type="range" data-pos aria-label="Позиция симуляции" step="60000">
        <span class="sim-r" data-sim-z></span>
        <span class="sim-t" data-sim-t></span>
      </div>`;
    tickClock();
  }
  // Обновление часов и ползунка симуляции (раз в секунду)
  function tickClock() {
    const c = document.getElementById('clock');
    if (c) c.textContent = U.fmtClock(U.now());
    const pos = header.querySelector('[data-pos]');
    if (pos) {
      const r = S.simRange();
      pos.min = r.start; pos.max = r.end;
      if (document.activeElement !== pos) pos.value = U.now();
      header.querySelector('[data-sim-a]').textContent = U.fmtDT(r.start);
      header.querySelector('[data-sim-z]').textContent = U.fmtDT(r.end);
      header.querySelector('[data-sim-t]').textContent = (S.simRunning ? '▶ идёт · ' : '⏸ пауза · ') + U.fmtDT(U.now());
    }
  }

  // Подключает экран выбранной роли
  function mountView() {
    main.innerHTML = '';
    const role = S.session().role;
    current = SC.views[role].mount(main);
  }

  header.addEventListener('click', (e) => {
    try {
      if (e.target.closest('[data-stand]')) { openStand(); return; }
      if (e.target.closest('[data-sim]')) { S.setSimulation(!S.simRunning); renderHeader(); U.toast(S.simRunning ? 'Симуляция запущена' : 'Симуляция на паузе'); return; }
      const sk = e.target.closest('[data-seek]');
      if (sk) { sk.dataset.seek === 'start' ? S.seek(0) : S.seekBy(Number(sk.dataset.seek)); tickClock(); return; }
      const r = e.target.closest('[data-role]');
      if (r) S.setRole(r.dataset.role);
    } catch (err) { U.toast(err.message, 'error'); }
  });
  header.addEventListener('change', (e) => {
    if (e.target.matches('[data-user]')) {
      try { S.setUser(e.target.value); } catch (err) { U.toast(err.message, 'error'); }
    }
    if (e.target.matches('[data-speed]')) { U.setSpeed(Number(e.target.value)); tickClock(); U.toast('Скорость времени ×' + e.target.value); }
    if (e.target.matches('[data-pos]')) { S.seek(Number(e.target.value)); e.target.blur(); tickClock(); }
  });
  header.addEventListener('input', (e) => {
    if (e.target.matches('[data-pos]')) header.querySelector('[data-sim-t]').textContent = 'перемотка → ' + U.fmtDT(Number(e.target.value));
  });

  S.subscribe((topic) => {
    if (topic === 'session') { renderHeader(); mountView(); }
    else if (current) current.refresh(topic);
    if (topic === 'admin') renderHeader();
  });

  // ---- стенд датчиков: эмулирует прошивку (подпись HMAC) и сеть датчиков; не зависит от роли пользователя ----
  const stand = document.getElementById('stand');
  let evtN = 0, lastEvt = null;
  // «СТЕНД ДАТЧИКОВ» — эмулятор прошивки для демонстрации и проверки. Позволяет отправить в шлюз телеметрии:
  // корректное событие (подписанное), событие с неверной подписью, без подписи, с неизвестным участком, повтор event_id,
  // а также вручную запустить проверку зависших датчиков (A-4). Для A-3 нужно два CRITICAL подряд с паузой больше 5 и не больше 15 минут
  // (удобно перемотать время или поставить скорость ×60).
  function openStand() {
    const th = S.thresholds();
    stand.innerHTML = `<form method="dialog" class="dlg-body">
      <h3>📡 Стенд датчиков</h3>
      <p class="muted small">Подписывает событие HMAC-SHA256 и отправляет в шлюз телеметрии. Для A-3: два CRITICAL подряд с паузой больше 5 и не больше 15 минут (скорость времени задаётся в панели симуляции под шапкой, удобно ×60). Для A-4: отправьте событие и подождите больше 5 минут системного времени.</p>
      <label>Участок<select data-r="loc">${S.locations().map((l) => `<option value="${l.id}">${l.id} — ${U.esc(l.name)} (${U.esc(l.zone || '')})</option>`).join('')}</select></label>
      <label>Показатель<select data-r="ind">${Object.entries(th).map(([k, t]) => `<option value="${k}">${U.esc(t.label)} (норма ${t.min}–${t.max})</option>`).join('')}</select></label>
      <label>Значение<input data-r="val" type="number" step="any" value="29"></label>
      <div class="btns">
        <button class="btn primary" type="button" data-ev="ok">Отправить событие</button>
        <button class="btn" type="button" data-ev="badsig">Неверная подпись</button>
        <button class="btn" type="button" data-ev="nosig">Без подписи</button>
        <button class="btn" type="button" data-ev="unknown">Неизвестный участок</button>
        <button class="btn" type="button" data-ev="replay">Повторить event_id</button>
        <button class="btn" type="button" data-ev="stale">Проверить зависшие (A-4)</button>
      </div>
      <div class="small" data-r="res" style="min-height:2.6em"></div>
      <div class="dlg-actions"><button class="btn ghost" value="close">Закрыть</button></div></form>`;
    stand.showModal();
  }
  // Короткий доступ к полям стенда
  const sg = (n) => stand.querySelector(`[data-r="${n}"]`);
  stand.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ev]');
    if (!b) return;
    const kind = b.dataset.ev, res = sg('res');
    try {
      if (kind === 'stale') { const n = S.checkStale(); res.textContent = n ? `⚠ Зависших датчиков: ${n}, эскалация отправлена руководителю` : 'Зависших датчиков нет (контролируются датчики, приславшие события в этом сеансе)'; return; }
      let evt;
      if (kind === 'replay') {
        if (!lastEvt) { res.textContent = 'Сначала отправьте корректное событие'; return; }
        evt = { ...lastEvt };
      } else {
        evt = { event_id: 'evt_' + Date.now().toString(36) + '_' + (++evtN), time: new Date(U.now()).toISOString(), location: sg('loc').value, indicator: sg('ind').value, value: Number(sg('val').value) };
        if (kind === 'unknown') evt.location = 'site_99';
        evt.signature = S.signEvent(evt);
        if (kind === 'badsig') evt.signature = evt.signature.slice(0, -1) + (evt.signature.slice(-1) === '0' ? '1' : '0');
        if (kind === 'nosig') delete evt.signature;
        if (kind === 'ok') lastEvt = { ...evt };
      }
      const r = S.ingestTelemetry(evt);
      res.textContent = `✔ ${r.status} · статус показания ${r.reading_status}` + (r.alert ? ` · алерт ${r.alert.alert_id}` : '') + (r.incident ? ` · инцидент ${r.incident.incident_id} (source=auto)` : '');
      U.toast(r.status === 'DUPLICATE' ? 'Дубликат (A-5): алерт не создан' : 'Событие принято', r.status === 'DUPLICATE' ? 'info' : 'ok');
    } catch (err) {
      res.textContent = '✖ ' + err.message;
      U.toast(err.message, 'error');
    }
  });

  renderHeader();
  mountView();
  setInterval(tickClock, 1000);
  setInterval(() => { try { if (S.simRunning) { S.checkStale(); S.syncSim(); } } catch (e) {} }, 1000); // A-4 и просрочка идут по симулируемому времени
})();
</script>
</body>
</html>
