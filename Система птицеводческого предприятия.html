<script>
/* ===================================================================================================
 * СИТУАЦИОННЫЙ ЦЕНТР (птицеводческое предприятие) — прототип в одном файле. КАРТА КОДА:
 *   js/utils.js   — часы системы (симуляция), SHA-256/HMAC, форматирование, CSV, уведомления
 *   js/data.js    — справочники, загрузка состояния из трёх встроенных CSV (sites / incidents / indicators)
 *   js/store.js   — «БЭКЕНД»: RBAC по зонам, жизненный цикл, аудит (append-only), телеметрия с HMAC,
 *                   правила A-3 / A-4 / A-5, просрочка (дедлайн = создание + 4 ч), симуляция времени
 *   js/views/*    — экраны ролей: диспетчер (и руководитель), рабочий, администратор
 *   js/app.js     — шапка, переключатель ролей, панель симуляции, стенд датчиков
 * Серверный аналог правил: backend/sc_backend.py. Исходные CSV в файле НЕ изменяются.
 * Состояние пользователя хранится в localStorage (ключ KEY в store.js).
 * =================================================================================================== */
/* ===== js/utils.js ===== */
(function () {
  const SC = (window.SC = window.SC || {});
  const U = (SC.utils = {});
  // Дополняет число нулём слева до 2 знаков (5 → «05») — для форматирования даты и времени
  const p2 = (n) => String(n).padStart(2, '0');

  // «Время системы» — симулируемое: стартует со времени самого первого инцидента в данных, реальное время ПК не используется
  // как точка отсчёта. Идёт только при запущенной симуляции (▶), скорость и позицию можно менять.
  let base = 0, t0 = Date.now(), speed = 60, running = false;
  // Часы системы: ставит текущее ВРЕМЯ СИМУЛЯЦИИ (мс). Реальное время ПК как точка отсчёта не используется
  U.setBase = (ms) => { base = ms; t0 = Date.now(); };
  // Текущее время системы (мс). На паузе стоит на месте, при запуске идёт со скоростью speed (×1, ×60 ...)
  U.now = () => (running ? base + (Date.now() - t0) * speed : base);
  // Меняет скорость хода времени, не сбивая текущее значение часов
  U.setSpeed = (k) => { base = U.now(); t0 = Date.now(); speed = k; };
  // Текущая скорость симуляции (множитель)
  U.speed = () => speed;
  // Запуск/пауза хода времени симуляции
  U.setRunning = (on) => { base = U.now(); t0 = Date.now(); running = !!on; };
  // Идёт ли сейчас симуляция
  U.running = () => running;

  // --- SHA-256 / HMAC-SHA256 (синхронно, без зависимостей; сверено с Python hmac и node:crypto) ---
  const PR = [];
  for (let n = 2; PR.length < 64; n++) { let ok = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { ok = false; break; } if (ok) PR.push(n); }
  // SHA-256 / HMAC-SHA256 на чистом JS (в браузере нет синхронного API). Результаты сверены с node:crypto и Python
  const f32 = (x) => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0;
  const K256 = PR.map((p) => f32(Math.cbrt(p)));
  const H256 = PR.slice(0, 8).map((p) => f32(Math.sqrt(p)));
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  // Считает SHA-256 от массива байт, возвращает массив из 32 байт
  function sha256Bytes(msg) {
    const l = msg.length, buf = new Uint8Array(((l + 9 + 63) >> 6) << 6);
    buf.set(msg); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(buf.length - 8, Math.floor(l / 0x20000000)); dv.setUint32(buf.length - 4, (l << 3) >>> 0);
    const h = H256.slice(), w = new Uint32Array(64);
    for (let o = 0; o < buf.length; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K256[i] + w[i]) >>> 0;
        const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      [a, b, c, d, e, f, g, hh].forEach((v, i) => { h[i] = (h[i] + v) >>> 0; });
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer);
    h.forEach((v, i) => ov.setUint32(i * 4, v));
    return out;
  }
  // Байты → строка из hex-цифр
  const hexOf = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
  // Строка → байты UTF-8
  U.utf8 = (s) => new TextEncoder().encode(String(s));
  // SHA-256 строки в hex (используется для цепочки хэшей аудита)
  U.sha256Hex = (s) => hexOf(sha256Bytes(U.utf8(s)));
  // HMAC-SHA256(ключ, сообщение) в hex — подпись событий датчиков
  U.hmacSha256Hex = (key, msg) => {
    let k = U.utf8(key);
    if (k.length > 64) k = sha256Bytes(k);
    const kk = new Uint8Array(64); kk.set(k);
    const m = U.utf8(msg), inner = new Uint8Array(64 + m.length);
    for (let i = 0; i < 64; i++) inner[i] = kk[i] ^ 0x36;
    inner.set(m, 64);
    const outer = new Uint8Array(96);
    for (let i = 0; i < 64; i++) outer[i] = kk[i] ^ 0x5c;
    outer.set(sha256Bytes(inner), 64);
    return hexOf(sha256Bytes(outer));
  };
  // сравнение без раннего выхода (аналог hmac.compare_digest)
  U.safeEqual = (a, b) => {
    a = String(a); b = String(b);
    let d = a.length ^ b.length;
    for (let i = 0; i < Math.max(a.length, b.length); i++) d |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
    return d === 0;
  };

  // Экранирует HTML-символы, чтобы данные пользователя нельзя было использовать для внедрения кода (XSS)
  U.esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Дата-время для таблиц: ДД.ММ.ГГГГ ЧЧ:ММ (в часовом поясе браузера, у нас МСК)
  U.fmtDT = (v) => {
    const d = new Date(v);
    return isNaN(d) ? '—' : `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  };
  // Дата-время с секундами для часов в шапке
  U.fmtClock = (v) => {
    const d = new Date(v);
    return `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
  };
  // Дата → формат для input type=datetime-local
  U.toLocalInput = (v) => {
    const d = new Date(v);
    if (isNaN(d)) return '';
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
  };
  // Значение input type=datetime-local → ISO-строка (UTC)
  U.fromLocalInput = (s) => {
    const d = new Date(s);
    if (isNaN(d)) throw new Error('Некорректная дата');
    return d.toISOString();
  };
  // Текст «осталось 2 ч 10 мин» / «просрочен на 15 мин» относительно времени системы
  U.relative = (v, now = U.now()) => {
    const ms = new Date(v) - now;
    const abs = Math.abs(ms);
    const h = Math.floor(abs / 3600000);
    const m = Math.floor((abs % 3600000) / 60000);
    const txt = h >= 24 ? `${Math.floor(h / 24)} д ${h % 24} ч` : h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
    return ms < 0 ? `просрочен на ${txt}` : `осталось ${txt}`;
  };

  // Разбор CSV (кавычки, запятые внутри значений) → массив объектов по заголовкам
  U.parseCSV = (text) => {
    text = String(text).replace(/^\uFEFF/, '');
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some((x) => x !== '')) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some((x) => x !== '')) rows.push(row);
    if (!rows.length) return [];
    const head = rows[0].map((h) => h.trim());
    return rows.slice(1).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
  };
  // Массив объектов → текст CSV с заданным порядком колонок
  U.toCSV = (rows, cols) => {
    const cell = (v) => {
      const s = String(v ?? '');
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return [cols.join(','), ...rows.map((r) => cols.map((c) => cell(r[c])).join(','))].join('\n') + '\n';
  };
  // Скачивание текста как файла (экспорт CSV)
  U.download = (name, text, mime = 'text/csv;charset=utf-8') => {
    const blob = new Blob(['\uFEFF' + text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // Всплывающее уведомление в правом нижнем углу (info / ok / error)
  U.toast = (msg, kind = 'info') => {
    const box = document.getElementById('toasts');
    if (!box) return;
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.classList.add('out'), 3200);
    setTimeout(() => t.remove(), 3700);
  };
})();

/* ===== js/data.js ===== */
/* data.js — справочники и загрузка данных из встроенных CSV (sites.csv, incidents.csv, indicators.csv).
 * Генератора случайных данных больше нет: всё берётся из файлов пользователя. */
(function () {
  const SC = (window.SC = window.SC || {});
  const U = SC.utils;
  const D = (SC.data = {});

  // Исходные CSV пользователя, встроены в файл без изменений (см. <script type=text/plain> выше)
  D.RAW = {
    sites: document.getElementById('csv-sites').textContent,
    incidents: document.getElementById('csv-incidents').textContent,
    indicators: document.getElementById('csv-indicators').textContent,
  };

  // единицы измерения в indicators.csv не заданы — для вентиляции единица не указывается
  D.INDICATORS = {
    temperature: { label: 'Температура', unit: '°C' },
    humidity: { label: 'Влажность', unit: '%' },
    ventilation: { label: 'Вентиляция', unit: '' },
  };
  // Типы инцидентов (значения поля type в incidents.csv) → русские названия
  D.TYPES = { ventilation: 'Вентиляция', humidity: 'Влажность', equipment: 'Оборудование', temperature: 'Температура', other: 'Прочее' };
  // Соответствие показателя датчика типу инцидента (для авто-инцидента A-3)
  D.INDICATOR_TYPE = { temperature: 'temperature', humidity: 'humidity', ventilation: 'ventilation' };
  // Статусы жизненного цикла инцидента, в порядке переходов
  D.STATUSES = ['NEW', 'ASSIGNED', 'IN_PROGRESS', 'CLOSED'];
  // Подписи статусов для интерфейса
  D.STATUS_LABELS = { NEW: 'Новый', ASSIGNED: 'Назначен', IN_PROGRESS: 'В работе', CLOSED: 'Закрыт' };
  // Роли пользователей → подписи
  D.ROLES = { dispatcher: 'Диспетчер', manager: 'Руководитель', worker: 'Рабочий', admin: 'Администратор' };
  // статусы показаний — как в indicators.csv
  D.SENSOR_STATUSES = ['NORMAL', 'WARNING', 'CRITICAL', 'STALE', 'DUPLICATE'];
  // Подписи статусов датчиков
  D.SENSOR_LABELS = { NORMAL: 'Норма', WARNING: 'Предупреждение', CRITICAL: 'Критично', STALE: 'Нет данных', NODATA: 'Нет данных', DUPLICATE: 'Дубликат' };

  // Статус → имя CSS-класса
  D.cls = (st) => (st === 'NODATA' ? 'stale' : String(st).toLowerCase());
  // Код показателя → русское название
  D.indLabel = (k) => (D.INDICATORS[k] || { label: k }).label;
  // zone_A → «зона A»
  D.zoneLabel = (z) => (z ? String(z).replace(/^zone_/i, 'зона ') : '');

  // ИСПРАВЛЕНИЕ «рабочие не могут принять задачу»: в incidents.csv у ВСЕХ инцидентов со статусом NEW уже указан
  // ответственный (responsible). По жизненному циклу рабочий может взять в работу только ASSIGNED (NEW→IN_PROGRESS запрещён),
  // поэтому кнопки «Принять в работу» не было, а срок (deadline) истекал. Инцидент с ответственным по смыслу уже назначен,
  // поэтому в приложении он трактуется как ASSIGNED. Файлы CSV при этом НЕ меняются; исходный статус хранится в file_status.
  D.normalizeIncident = (inc) => {
    if (inc.status === 'NEW' && inc.responsible) {
      inc.file_status = 'NEW'; // исходный статус из файла — нужен для записи в аудите и для прозрачности
      inc.status = 'ASSIGNED'; // назначен ответственный → статус «Назначен»
    }
    return inc;
  };

  // Строит начальное состояние системы ИЗ ТРЁХ CSV (данные заказчика, менять их нельзя):
  //   sites.csv → участки и зоны;  incidents.csv → инциденты (source='file');  indicators.csv → показания датчиков (src='file').
  // Нормы (norm_min/norm_max) показателей берутся из файла. Сотрудники в файлах отсутствуют (там только id рабочих e_101…e_105),
  // поэтому ФИО, логины и отчества — УСЛОВНЫЕ; участки рабочих выводятся из incidents.csv (responsible → location).
  // Всё, что пользователь делает в приложении, живёт в этом объекте состояния/localStorage, а не в файлах.
  D.createStateFromFiles = () => {
    const sites = U.parseCSV(D.RAW.sites);
    const inc = U.parseCSV(D.RAW.incidents);
    const ind = U.parseCSV(D.RAW.indicators);

    const readings = ind
      .map((r) => ({
        time: new Date(r.time).toISOString(),
        location: r.location,
        indicator: r.indicator,
        value: r.value === '' ? null : Number(r.value),
        norm_min: Number(r.norm_min),
        norm_max: Number(r.norm_max),
        status: r.status, src: 'file',
      }))
      .sort((a, b) => a.time.localeCompare(b.time));

    // нормы по показателям берутся из файла (последняя запись показателя)
    const thresholds = {};
    for (const k of Object.keys(D.INDICATORS)) thresholds[k] = { ...D.INDICATORS[k], min: null, max: null };
    for (const r of readings) {
      if (!thresholds[r.indicator]) thresholds[r.indicator] = { label: r.indicator, unit: '', min: null, max: null };
      thresholds[r.indicator].min = r.norm_min;
      thresholds[r.indicator].max = r.norm_max;
    }

    const locations = sites.map((s) => ({ id: s.site_id, name: s.name, zone: s.zone }));
    const incidents = inc.map((r) => D.normalizeIncident({ // normalizeIncident: NEW + ответственный → ASSIGNED (см. комментарий выше)
      incident_id: r.incident_id, type: r.type, location: r.location,
      time: new Date(r.time).toISOString(), responsible: r.responsible, status: r.status,
      deadline: new Date(r.deadline).toISOString(), description: '', source: 'file',
    }));
    for (const x of incidents) if (!locations.some((l) => l.id === x.location)) locations.push({ id: x.location, name: x.location, zone: '' });

    const maxNum = incidents.reduce((m, x) => Math.max(m, parseInt(x.incident_id.replace(/\D/g, ''), 10) || 0), 0);
    const baseMs = Math.min(...incidents.map((x) => +new Date(x.time))); // старт системного времени — первый инцидент в файле
    // участки сотрудника: у рабочих — из incidents.csv (responsible → location), у остальных — все участки их зон
    const byResp = {};
    for (const x of incidents) if (x.responsible) (byResp[x.responsible] = byResp[x.responsible] || new Set()).add(x.location);
    const sitesOf = (id, zones) => (byResp[id] ? [...byResp[id]].sort() : zones === '*' ? '*' : locations.filter((l) => zones.includes(l.zone)).map((l) => l.id));

    return {
      session: { role: 'dispatcher', userId: 'e_002' },
      // ответственные e_101…e_105 взяты из incidents.csv; ФИО (с отчествами) в файлах отсутствуют — подставлены условные
      users: [
        { id: 'e_001', name: 'Власова Ирина Андреевна', login: 'admin', role: 'admin', active: true, zones: '*', sites: sitesOf('e_001', '*') },
        { id: 'e_002', name: 'Орлов Сергей Викторович', login: 'orlov', role: 'dispatcher', active: true, zones: '*', sites: sitesOf('e_002', '*') },
        { id: 'e_003', name: 'Кузнецова Анна Павловна', login: 'kuznetsova', role: 'dispatcher', active: true, zones: ['zone_A', 'zone_B'], sites: sitesOf('e_003', ['zone_A', 'zone_B']) },
        { id: 'e_004', name: 'Громов Олег Игоревич', login: 'gromov', role: 'dispatcher', active: true, zones: ['zone_C'], sites: sitesOf('e_004', ['zone_C']) },
        { id: 'e_005', name: 'Лебедев Виктор Николаевич', login: 'lebedev', role: 'manager', active: true, zones: '*', sites: sitesOf('e_005', '*') },
        { id: 'e_101', name: 'Смирнов Пётр Алексеевич', login: 'smirnov', role: 'worker', active: true, zones: ['zone_C'], sites: sitesOf('e_101', ['zone_C']) },
        { id: 'e_102', name: 'Петров Иван Сергеевич', login: 'petrov', role: 'worker', active: true, zones: ['zone_A'], sites: sitesOf('e_102', ['zone_A']) },
        { id: 'e_103', name: 'Соколова Мария Ивановна', login: 'sokolova', role: 'worker', active: true, zones: ['zone_A'], sites: sitesOf('e_103', ['zone_A']) },
        { id: 'e_104', name: 'Новиков Алексей Дмитриевич', login: 'novikov', role: 'worker', active: true, zones: ['zone_B'], sites: sitesOf('e_104', ['zone_B']) },
        { id: 'e_105', name: 'Волков Дмитрий Олегович', login: 'volkov', role: 'worker', active: true, zones: ['zone_B'], sites: sitesOf('e_105', ['zone_B']) },
      ],
      locations,
      thresholds,
      incidents,
      readings,
      comments: [],
      logs: [{
        time: new Date(baseMs).toISOString(), user: 'system', role: 'system', action: 'SYSTEM_START', level: 'INFO',
        details: `Загружено из файлов: участков ${locations.length}, инцидентов ${incidents.length}, показаний ${readings.length}`,
      }],
      seq: { incident: maxNum, comment: 0 },
    };
  };
})();

/* ===== js/store.js ===== */
/* store.js — «backend» прототипа: состояние, RBAC по зонам, строгий жизненный цикл, журнал аудита (append-only),
 * приём телеметрии с проверкой подписи HMAC-SHA256 и правила A-3 / A-4 / A-5.
 * Серверный эквивалент с теми же правилами: backend/sc_backend.py (секрет — в переменной окружения).
 * Здесь ключ подписи — демонстрационный: в браузере секрет хранить нельзя, это только эмуляция шлюза. */
(function () {
  const SC = (window.SC = window.SC || {});
  const D = SC.data, U = SC.utils;
  const KEY = 'sc-proto-state-v6'; // v6: инциденты NEW с ответственным трактуются как ASSIGNED (старое сохранение не подходит) // v4: пользователи с отчеством и участками, дедлайн автоматический, симулируемое время
  const GENESIS = '0'.repeat(64);
  const SENSOR_KEY = 'demo-only-key-NOT-A-SECRET'; // продакшн: SENSOR_HMAC_SECRET в окружении сервера
  // Временные константы правил (в миллисекундах):
  //   DEDUP_MS  — A-5: окно дедупликации, 5 минут. Повтор того же датчика в пределах окна = DUPLICATE, алерт не создаётся.
  //   CRIT_MS   — A-3: окно 15 минут: два CRITICAL подряд внутри окна → автоматический инцидент.
  //   STALE_MS  — A-4: если от датчика нет данных дольше 5 минут → статус STALE + эскалация руководителю.
  //   TTL_MS    — срок инцидента 4 часа: deadline = время создания + TTL_MS (ставится автоматически, вручную не меняется).
  const DEDUP_MS = 5 * 60000, CRIT_MS = 15 * 60000, STALE_MS = 5 * 60000, TTL_MS = 4 * 3600000;
  // ЖИЗНЕННЫЙ ЦИКЛ инцидента: из какого статуса в какие можно перейти. Единственный допустимый путь:
  //   NEW → ASSIGNED → IN_PROGRESS → CLOSED.  Пропускать шаги нельзя (NEW → IN_PROGRESS запрещён),
  //   назад идти нельзя, а из CLOSED выхода нет вообще (закрытый инцидент не переоткрывается — создаётся новый).
  const ALLOWED = { NEW: ['ASSIGNED'], ASSIGNED: ['IN_PROGRESS'], IN_PROGRESS: ['CLOSED'], CLOSED: [] };

  // ПРАВА (RBAC). DISPATCH — набор прав диспетчера. Руководитель получает всё то же + эскалации и аудит.
  // Рабочий видит и ведёт только свои задачи. Администратор управляет пользователями/справочниками/реестром, инциденты не ведёт.
  // Право проверяется функцией guard(); доступ к УЧАСТКУ (зоне) — отдельно функцией zoneGuard().
  const DISPATCH = ['sensors.view', 'incident.view_all', 'incident.create', 'incident.status', 'incident.assign', 'incident.comment'];
  const PERMS = {
    dispatcher: DISPATCH,
    manager: [...DISPATCH, 'escalations.view', 'audit.view'],
    worker: ['incident.view_own', 'incident.take', 'incident.close', 'incident.comment'],
    admin: ['sensors.view', 'users.manage', 'directory.manage', 'logs.view', 'registry.view', 'audit.view'],
  };

  class AccessError extends Error {}
  // Бизнес-ошибка с машинным кодом (поле code): LIFECYCLE_TRANSITION_FORBIDDEN, ZONE_ACCESS_DENIED, SENSOR_SIGNATURE_INVALID,
  // INCIDENT_OVERDUE и т.д. Интерфейс показывает текст, тесты и API проверяют code.  AccessError выше — «нет прав у роли».
  class ScError extends Error {
    constructor(code, msg) { super(msg ? `${code}: ${msg}` : code); this.code = code; }
  }
  const S = (SC.store = { PERMS, AccessError, ScError, ALLOWED });
  const subs = new Set();
  let state = load();
  initClock();
  ensureBaselineAudit();

  // Загрузка состояния при старте страницы.
  //   1) Пробуем прочитать сохранённое состояние из localStorage (ключ KEY) и проверяем, что оно целое (есть readings/incidents/audit).
  //   2) Если нет (первый запуск, другая версия ключа, пустое хранилище) — строим состояние из трёх CSV: D.createStateFromFiles().
  //   3) Добиваем отсутствующие поля значениями по умолчанию (на случай состояния, сохранённого более старой версией кода).
  //   4) Замораживаем (Object.freeze) все записи аудита — они неизменяемы и после перезагрузки.
  function load() {
    let s = null;
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.readings) && Array.isArray(p.incidents) && Array.isArray(p.audit)) s = p;
      }
    } catch (e) { /* нет localStorage — работаем в памяти */ }
    if (!s) s = D.createStateFromFiles();
    for (const k of ['alerts', 'escalations', 'audit']) s[k] = s[k] || [];
    for (const k of ['live', 'staleOpen', 'seen']) s[k] = s[k] || {};
    s.tstats = s.tstats || { accepted: 0, duplicate: 0, rejected: 0 };
    s.seq.alert = s.seq.alert || 0; s.seq.esc = s.seq.esc || 0;
    s.audit.forEach(Object.freeze); // записи аудита неизменяемы и после загрузки
    return s;
  }
  // Точка отсчёта системного времени: время САМОГО РАННЕГО инцидента среди загруженных данных (по ТЗ), реальные часы ПК не используются.
  // Симуляция при этом стоит на паузе — время пойдёт только после нажатия ▶ в шапке.
  // Для данных заказчика это 01.11.2025 08:00 UTC (11:00 по Москве).
  function initClock() {
    let m = Infinity;
    state.incidents.forEach((i) => { const t = new Date(i.time).getTime(); if (t < m) m = t; });
    U.setBase(isFinite(m) ? m : 0);
    U.setRunning(false);
  }
  // Сохраняет состояние в localStorage (в реальной системе здесь была бы БД)
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  // ЕДИНАЯ ТОЧКА ИЗМЕНЕНИЯ ДАННЫХ. Каждая операция, которая что-то меняет, заканчивается вызовом emit(тема):
  //   — сохраняет состояние (save), — оповещает все подписанные экраны, чтобы они перерисовались.
  // Темы: 'incidents' (инциденты), 'telemetry' (датчики/алерты), 'logs', 'directory', 'admin' (пользователи), 'session' (смена роли).
  function emit(topic) { save(); subs.forEach((f) => f(topic)); }
  // Подписка интерфейса на изменения данных; возвращает функцию отписки
  S.subscribe = (fn) => { subs.add(fn); return () => subs.delete(fn); };

  // ---------- сессия, права, зоны ----------
  S.session = () => state.session;
  // Текущий пользователь (объект)
  S.currentUser = () => state.users.find((u) => u.id === state.session.userId);
  // RBAC: есть ли у текущей роли право perm
  S.can = (perm) => (PERMS[state.session.role] || []).includes(perm);
  // Зона участка (site_01 → zone_A) по справочнику sites
  S.zoneOf = (loc) => (state.locations.find((l) => l.id === loc) || {}).zone || '';
  // Список всех зон
  S.zones = () => [...new Set(state.locations.map((l) => l.zone).filter(Boolean))].sort();
  // ZONE-BASED RBAC. Участок принадлежит зоне (sites.csv: site_01/02 → zone_A, site_03/04 → zone_B, site_05 → zone_C).
  // Пользователь видит участок, только если зона участка входит в его список zones. Значение '*' = все зоны
  // (старший диспетчер, руководитель, администратор). Именно эта функция отрезает диспетчеру чужие зоны.
  S.userHasZone = (u, loc) => !!u && (u.zones === '*' || (u.zones || []).includes(S.zoneOf(loc)));
  // Видит ли текущий пользователь участок loc
  S.canSee = (loc) => S.userHasZone(S.currentUser(), loc);
  // Участки, доступные текущему пользователю
  S.visibleLocations = () => state.locations.filter((l) => S.canSee(l.id));
  // Подпись «за какие участки отвечает сотрудник» (выводится рядом с ФИО)
  S.sitesLabel = (u) => (!u ? '' : u.sites === '*' ? 'все участки' : (u.sites || []).join(', ') || 'участки не назначены');
  // Подпись зон сотрудника
  S.zonesLabel = (u) => (u.zones === '*' ? 'все зоны' : (u.zones || []).map((z) => D.zoneLabel(z)).join(', ') || 'нет зон');

  // ДЕМО-переключатель роли (кнопки вверху экрана). В настоящей системе роль определяется входом по логину/паролю.
  // Берёт первого активного пользователя этой роли (диспетчер → Орлов, рабочий → Смирнов и т.д.), запоминает в сессии,
  // пишет ROLE_SWITCH в системный журнал и перерисовывает интерфейс (тема 'session').
  S.setRole = (role) => {
    if (!PERMS[role]) throw new Error('Неизвестная роль');
    const u = state.users.find((x) => x.role === role && x.active);
    if (!u) throw new Error('Нет активных пользователей с ролью ' + D.ROLES[role]);
    state.session = { role, userId: u.id };
    log('ROLE_SWITCH', `Переключение на роль «${D.ROLES[role]}» (${u.name})`);
    emit('session');
  };
  // Вход под конкретным пользователем той же роли
  S.setUser = (id) => {
    const u = state.users.find((x) => x.id === id && x.active);
    if (!u) throw new Error('Пользователь не найден');
    state.session = { role: u.role, userId: u.id };
    log('USER_SWITCH', `Вход как ${u.name} (${D.ROLES[u.role]}, ${S.zonesLabel(u)})`);
    emit('session');
  };

  // СИСТЕМНЫЙ журнал — технические события (вход, смена роли, отказ в доступе, отклонённая телеметрия, просрочка ...).
  // Хранит последние 500 записей, может быть изменён/ротирован. Отличие от аудита: аудит (audit()) — юридически значимые
  // действия над инцидентами и алертами, он неизменяем (append-only). level: INFO / WARN. sys — имя системного источника.
  function log(action, details, level = 'INFO', sys) {
    const u = state.users.find((x) => x.id === state.session.userId);
    state.logs.unshift({ time: new Date(U.now()).toISOString(), user: sys || (u ? u.name : 'system'), role: sys ? 'system' : state.session.role, action, details, level });
    if (state.logs.length > 500) state.logs.length = 500;
  }
  // Проверка права РОЛИ на действие. Нет права → запись ACCESS_DENIED в журнал + AccessError (интерфейс покажет уведомление).
  // Вызывается в начале каждой операции store (S.createIncident, S.assign, S.saveUser ...).
  function guard(perm) {
    if (!S.can(perm)) {
      log('ACCESS_DENIED', `Роль «${D.ROLES[state.session.role]}» не имеет права ${perm}`, 'WARN');
      emit('logs');
      throw new AccessError('Недостаточно прав для этого действия');
    }
  }
  // Проверка доступа к УЧАСТКУ: участок вне зон текущего пользователя → ZONE_ACCESS_DENIED.
  // Даже диспетчер с правом incident.assign не может трогать инциденты чужой зоны (zone-based RBAC).
  function zoneGuard(loc) {
    if (!S.canSee(loc)) {
      log('ACCESS_DENIED', `Участок ${loc} (${S.zoneOf(loc)}) вне зон пользователя ${S.currentUser().name}`, 'WARN');
      emit('logs');
      throw new ScError('ZONE_ACCESS_DENIED', `участок ${loc} (${D.zoneLabel(S.zoneOf(loc))}) вне ваших зон`);
    }
  }
  // Найти инцидент по id или бросить ошибку
  const findInc = (id) => {
    const i = state.incidents.find((x) => x.incident_id === id);
    if (!i) throw new Error('Инцидент не найден: ' + id);
    return i;
  };
  // Рабочий может менять только СВОИ задачи (inc.responsible === его id). Чужая задача → отказ + запись в журнал.
  function ownOrDeny(inc) {
    if (inc.responsible !== state.session.userId) {
      log('ACCESS_DENIED', `Попытка работать с чужим инцидентом ${inc.incident_id}`, 'WARN');
      emit('logs');
      throw new AccessError('Это задача другого сотрудника');
    }
  }

  // ---------- журнал аудита (append-only, цепочка хэшей) ----------
  function auditPayload(r) { return [r.event_id, r.entity_type, r.entity_id, r.action, r.from_status, r.to_status, r.actor, r.at, r.ip, r.details, r.prev_hash].join('|'); } // function: вызывается до инициализации остальных const
  // IP для записи аудита. В браузере настоящего адреса нет — подставляется демо-адрес; на сервере брать из запроса
  function ipFor(actor) {
    if (actor === 'system' || actor === 'sensor-gateway') return '127.0.0.1';
    return '10.10.0.' + (((parseInt(String(actor).replace(/\D/g, ''), 10) || 0) % 250) + 1); // демо-IP: в браузере реальный адрес недоступен
  }
  // ЖУРНАЛ АУДИТА (AuditEvent), append-only. Одна запись = одно значимое действие:
  //   event_id (aud_00001 ...), entity_type ('incident'|'alert'), entity_id, action ('created'|'assigned'|'status_changed'|'closed'),
  //   from_status → to_status, actor (кто: id пользователя или 'system'/'sensor-gateway'), at (ISO-время СИСТЕМЫ), ip, details.
  // ЦЕПОЧКА ХЭШЕЙ: в каждую запись пишется prev_hash (хэш предыдущей) и hash = SHA-256 от всех полей записи.
  // Если кто-то подправит или удалит запись в середине, цепочка порвётся, и verifyAudit() это покажет.
  // Запись замораживается Object.freeze — менять её в коде нельзя. API изменения/удаления нет (см. appendOnly).
  function audit(type, id, action, from, to, details, o) {
    o = o || {};
    const actor = o.actor || (state.session && state.session.userId) || 'system';
    const prev = state.audit.length ? state.audit[state.audit.length - 1].hash : GENESIS;
    const rec = {
      event_id: 'aud_' + String(state.audit.length + 1).padStart(5, '0'), entity_type: type, entity_id: id, action,
      from_status: from == null ? null : from, to_status: to == null ? null : to, actor,
      at: o.at || new Date(U.now()).toISOString(), ip: ipFor(actor), details: details || '', prev_hash: prev,
    };
    rec.hash = U.sha256Hex(auditPayload(rec));
    state.audit.push(Object.freeze(rec));
  }
  // При самом первом запуске (аудит пуст) заносим в журнал исторические инциденты из файла как 'created' с временем самого инцидента,
  // чтобы у каждого инцидента была точка начала истории. Если статус был нормализован (NEW + ответственный → ASSIGNED),
  // в details пишется исходный статус из файла.
  function ensureBaselineAudit() {
    if (state.audit.length) return;
    [...state.incidents].sort((a, b) => a.time.localeCompare(b.time)).forEach((i) =>
      audit('incident', i.incident_id, 'created', null, i.status, 'импорт из incidents.csv (исторические данные)' + (i.file_status ? `; в файле статус ${i.file_status}, но ответственный ${i.responsible} указан — принят как ${i.status}` : ''), { actor: 'system', at: i.time })); // пометка для аудита, если статус нормализован
  }
  // Чтение журнала аудита (право audit.view: руководитель, админ)
  S.auditLog = () => { guard('audit.view'); return state.audit.slice(); };
  // Проверка целостности цепочки хэшей; возвращает место разрыва, если запись подделана
  S.verifyAudit = () => {
    guard('audit.view');
    let prev = GENESIS;
    for (let i = 0; i < state.audit.length; i++) {
      const r = state.audit[i];
      if (r.prev_hash !== prev || r.hash !== U.sha256Hex(auditPayload(r))) return { ok: false, at: i, total: state.audit.length };
      prev = r.hash;
    }
    return { ok: true, total: state.audit.length };
  };
  // API изменения/удаления отсутствует по замыслу; эти методы лишь явно отказывают (и пишут попытку в системный журнал)
  const appendOnly = (what) => () => {
    log('AUDIT_TAMPER_ATTEMPT', `Попытка ${what} записей аудита отклонена`, 'WARN');
    emit('logs');
    throw new ScError('AUDIT_APPEND_ONLY', `${what} записей аудита запрещено`);
  };
  // Попытка изменения записи аудита → всегда отказ AUDIT_APPEND_ONLY
  S.auditUpdate = appendOnly('изменения');
  // Попытка удаления записи аудита → всегда отказ AUDIT_APPEND_ONLY
  S.auditDelete = appendOnly('удаления');

  // ---------- чтение ----------
  S.users = () => state.users.slice();
  // ФИО по id
  S.userName = (id) => (state.users.find((u) => u.id === id) || {}).name || (id || '—');
  // Список участков
  S.locations = () => state.locations.slice();
  // Название участка по коду
  S.locName = (id) => (state.locations.find((l) => l.id === id) || {}).name || id;
  // Нормы датчиков (min/max) по показателям — из indicators.csv
  S.thresholds = () => state.thresholds;
  // Комментарии к инциденту
  S.comments = (id) => state.comments.filter((c) => c.incident_id === id);
  // ПРОСРОЧЕН ЛИ ИНЦИДЕНТ: статус не CLOSED и deadline (создание + 4 ч) уже раньше ТЕКУЩЕГО ВРЕМЕНИ СИСТЕМЫ (не часов компьютера).
  // Используется и для подсветки в таблицах, и для запрета брать задачу в работу (S.changeStatus), и для алерта OVERDUE.
  S.isOverdue = (i) => i.status !== 'CLOSED' && new Date(i.deadline) < U.now();

  // Записи из файлов существуют только с момента своего времени; созданные в сеансе (manual/auto) видны всегда
  const seenIncident = (i) => i.source !== 'file' || new Date(i.time).getTime() <= U.now();
  // То же для показаний датчиков (файловых и симулированных)
  const seenReading = (r) => (r.src !== 'file' && r.src !== 'sim') || new Date(r.time).getTime() <= U.now();
  // Какие инциденты видит текущий пользователь:
  //   — диспетчер/руководитель: все инциденты СВОИХ зон; — рабочий: только назначенные ему (и только в его зонах).
  // Инциденты из файла показываются, только когда время системы дошло до их времени (seenIncident) — так работает «проигрывание» данных.
  S.listIncidents = () => {
    if (S.can('incident.view_all')) return state.incidents.filter((i) => seenIncident(i) && S.canSee(i.location));
    if (S.can('incident.view_own')) return state.incidents.filter((i) => seenIncident(i) && i.responsible === state.session.userId && S.canSee(i.location));
    guard('incident.view_all');
  };

  const FINAL = { CLOSED: 1, RESOLVED: 1 };
  // Собирает для мониторинга состояние КАЖДОГО датчика (участок × показатель): последнее показание, его статус, норму,
  // последнее валидное значение и историю для мини-графика (последние 12 точек). Если показаний ещё нет — статус NODATA.
  // Учитываются только показания, которые «уже случились» по времени системы (seenReading), поэтому графики меняются по ходу симуляции.
  function computeSensors() {
    const out = [];
    for (const l of S.visibleLocations()) {
      for (const [ind, th] of Object.entries(state.thresholds)) {
        const hist = state.readings.filter((r) => seenReading(r) && r.location === l.id && r.indicator === ind && r.status !== 'DUPLICATE');
        const last = hist[hist.length - 1];
        const valid = hist.filter((r) => r.value != null);
        out.push({
          location: l.id, indicator: ind, label: th.label, unit: th.unit,
          min: last ? last.norm_min : th.min, max: last ? last.norm_max : th.max,
          status: last ? last.status : 'NODATA', value: last ? last.value : null, time: last ? last.time : null,
          lastValid: valid[valid.length - 1] || null,
          history: hist.slice(-12).map((r) => ({ t: r.time, v: r.value })),
        });
      }
    }
    return out;
  }
  // Датчики для мониторинга (с проверкой права и зон)
  S.sensors = () => { guard('sensors.view'); return computeSensors(); };
  // Таблица показаний (без симулированных «живых» точек)
  S.readings = () => { guard('sensors.view'); return state.readings.filter((r) => r.src !== 'sim' && seenReading(r) && S.canSee(r.location)); };
  // Алерты (по датчикам и просрочкам), видимые пользователю, новые сверху
  S.alertList = () => { guard('sensors.view'); return state.alerts.filter((a) => S.canSee(a.location)).slice().reverse(); };
  // Эскалации руководителю (правило A-4)
  S.escalations = () => { guard('escalations.view'); return state.escalations.filter((x) => S.canSee(x.location)).slice().reverse(); };
  // Системный журнал
  S.logs = () => { guard('logs.view'); return state.logs.slice(); };
  // Счётчики телеметрии: принято / дубликатов / отклонено
  S.telemetryStats = () => ({ ...state.tstats });
  // Реестр данных (то, что лежит в CSV) для админа
  S.registry = () => { guard('registry.view'); return { incidents: state.incidents.slice(), readings: state.readings.filter((r) => r.src !== 'sim') }; };

  // ---------- инциденты: зоны и строгий жизненный цикл ----------
  const pad = (n, w = 3) => String(n).padStart(w, '0');
  // Создаёт запись инцидента. Время создания = время системы, дедлайн = created_at + 4 часа (автоматически, вручную не задаётся)
  function newIncident(p) {
    const inc = {
      incident_id: `inc_${pad(++state.seq.incident)}`, type: p.type, location: p.location, time: new Date(U.now()).toISOString(),
      responsible: '', status: 'NEW', deadline: new Date(U.now() + TTL_MS).toISOString(), description: p.description || '', source: p.source || 'manual',
      related_to: p.related_to || '', alert_id: p.alert_id || '',
    };
    state.incidents.push(inc);
    return inc;
  }
  // СОЗДАНИЕ ИНЦИДЕНТА ВРУЧНУЮ (форма «Создать инцидент»). Входные данные: type, location, description, responsible (необязательно).
  // Время создания и дедлайн НЕ принимаются от пользователя — ставятся автоматически (время системы и +4 часа).
  // Проверки: право incident.create, тип из справочника, участок из sites.csv, участок в зонах пользователя.
  // Результат: инцидент в статусе NEW (или ASSIGNED, если сразу выбран ответственный) + запись аудита 'created'.
  S.createIncident = (p) => {
    guard('incident.create');
    if (!D.TYPES[p.type]) throw new Error('Неверный тип инцидента');
    if (!state.locations.some((l) => l.id === p.location)) throw new Error('Неизвестный участок');
    zoneGuard(p.location);
    const inc = newIncident(p);
    audit('incident', inc.incident_id, 'created', null, 'NEW', `source=${inc.source}` + (inc.related_to ? `; related_to=${inc.related_to}` : ''));
    if (p.responsible) assignInternal(inc, p.responsible);
    log('INCIDENT_CREATE', `${inc.incident_id}: ${D.TYPES[inc.type]} / ${inc.location}`);
    emit('incidents');
    return inc;
  };
  // Назначение ответственного (общая часть для формы создания и для таблицы). Правила:
  //   — назначить можно только активного РАБОЧЕГО; — у него должен быть доступ к зоне участка;
  //   — переназначать можно только пока инцидент NEW или ASSIGNED (в работе/закрытый — нельзя).
  // Статус становится ASSIGNED, в аудит пишется 'assigned' (assignee=...).
  function assignInternal(inc, userId) {
    const u = state.users.find((x) => x.id === userId);
    if (!u || u.role !== 'worker' || !u.active) throw new Error('Ответственным можно назначить только активного рабочего');
    if (!S.userHasZone(u, inc.location)) throw new ScError('ZONE_ACCESS_DENIED', `${u.name} не допущен к зоне ${D.zoneLabel(S.zoneOf(inc.location))}`);
    if (inc.status !== 'NEW' && inc.status !== 'ASSIGNED') throw new ScError('LIFECYCLE_TRANSITION_FORBIDDEN', 'переназначение возможно только для «Новый» и «Назначен»');
    const from = inc.status;
    inc.responsible = userId;
    inc.status = 'ASSIGNED';
    audit('incident', inc.incident_id, 'assigned', from, 'ASSIGNED', `assignee=${userId}`);
  }
  // Назначить/переназначить ответственного (аудит: 'assigned')
  S.assign = (id, userId) => {
    guard('incident.assign');
    const inc = findInc(id);
    zoneGuard(inc.location);
    if (inc.status === 'CLOSED') throw new ScError('LIFECYCLE_REOPEN_FORBIDDEN', 'закрытый инцидент неизменяем — создайте новый');
    if (!userId) {
      if (inc.status === 'NEW') return;
      throw new ScError('LIFECYCLE_TRANSITION_FORBIDDEN', 'снять ответственного нельзя — переназначьте на другого рабочего');
    }
    assignInternal(inc, userId);
    log('INCIDENT_ASSIGN', `${id} → ${S.userName(userId)}`);
    emit('incidents');
  };
  // СМЕНА СТАТУСА — сердце жизненного цикла. Порядок проверок:
  //   1) участок в зонах пользователя;  2) право: рабочий — incident.take (в работу) или incident.close (закрыть) и только по СВОЕЙ задаче;
  //      остальные роли — incident.status;  3) рабочий не может взять в работу ПРОСРОЧЕННУЮ задачу (INCIDENT_OVERDUE);
  //   4) из CLOSED выхода нет (LIFECYCLE_REOPEN_FORBIDDEN);  5) переход должен быть в таблице ALLOWED (иначе LIFECYCLE_TRANSITION_FORBIDDEN);
  //   6) в ASSIGNED нельзя без ответственного (LIFECYCLE_NO_ASSIGNEE).
  // После успеха: запись аудита ('closed' для закрытия, иначе 'status_changed'); при закрытии связанные алерты тоже закрываются.
  S.changeStatus = (id, to) => {
    const inc = findInc(id);
    zoneGuard(inc.location);
    if (!D.STATUSES.includes(to)) throw new Error('Неизвестный статус');
    if (state.session.role === 'worker') {
      guard(to === 'IN_PROGRESS' ? 'incident.take' : 'incident.close');
      ownOrDeny(inc);
      // ПРАВИЛО: просроченную задачу (срок created_at + 4 ч истёк, статус не CLOSED) рабочий взять в работу не может.
      // Проверка только для перехода в IN_PROGRESS: задачу, которую уже взяли вовремя, закрыть можно и после срока.
      // Такая задача висит как тревога у диспетчера — он решает, что с ней делать (переназначить и т.д.).
      if (to === 'IN_PROGRESS' && S.isOverdue(inc)) {
        log('INCIDENT_TAKE_DENIED', `${id}: срок истёк ${U.fmtDT(inc.deadline)} — рабочий ${S.currentUser().name} не может взять просроченную задачу`, 'WARN'); // след в системном журнале
        emit('logs');
        throw new ScError('INCIDENT_OVERDUE', 'срок задачи истёк — взять её в работу нельзя, обратитесь к диспетчеру');
      }
    } else guard('incident.status');
    const from = inc.status;
    if (from === to) return;
    if (from === 'CLOSED') throw new ScError('LIFECYCLE_REOPEN_FORBIDDEN', 'закрытый инцидент нельзя открыть заново — создайте новый');
    // Главная проверка цикла: переход допустим только если он есть в таблице ALLOWED (никаких пропусков шагов).
    if (!ALLOWED[from].includes(to)) throw new ScError('LIFECYCLE_TRANSITION_FORBIDDEN', `${from} → ${to} запрещён (допустимо: ${ALLOWED[from].join(', ') || '—'})`);
    if (to === 'ASSIGNED' && !inc.responsible) throw new ScError('LIFECYCLE_NO_ASSIGNEE', 'сначала назначьте ответственного');
    inc.status = to;
    audit('incident', id, to === 'CLOSED' ? 'closed' : 'status_changed', from, to);
    // При закрытии инцидента закрываем и связанные с ним алерты (статус INCIDENT → CLOSED), каждый переход — запись в аудит.
    if (to === 'CLOSED') {
      state.alerts.filter((a) => a.incident_id === id && a.status === 'INCIDENT').forEach((a) => {
        audit('alert', a.alert_id, 'closed', 'INCIDENT', 'CLOSED', `закрыт инцидент ${id}`);
        a.status = 'CLOSED';
      });
    }
    log('INCIDENT_STATUS', `${id}: ${from} → ${to}`);
    emit('incidents');
  };
  // «↻ Новый» — повторный инцидент. Закрытый инцидент нельзя открыть заново, поэтому создаётся НОВЫЙ того же типа и участка
  // со ссылкой related_to на старый. Работает только для CLOSED.
  S.createFollowUp = (id) => {
    guard('incident.create');
    const old = findInc(id);
    zoneGuard(old.location);
    if (old.status !== 'CLOSED') throw new ScError('LIFECYCLE_TRANSITION_FORBIDDEN', 'повторный инцидент создаётся только по закрытому');
    return S.createIncident({ type: old.type, location: old.location, description: `Повторный инцидент по ${id}`, related_to: id });
  };
  // Комментарий к инциденту (в закрытый нельзя)
  S.addComment = (id, text) => {
    guard('incident.comment');
    text = String(text || '').trim();
    if (!text) throw new Error('Комментарий пуст');
    const inc = findInc(id);
    zoneGuard(inc.location);
    if (inc.status === 'CLOSED') throw new ScError('LIFECYCLE_REOPEN_FORBIDDEN', 'закрытый инцидент неизменяем');
    if (state.session.role === 'worker') ownOrDeny(inc);
    state.comments.push({ id: ++state.seq.comment, incident_id: id, user_id: state.session.userId, time: new Date(U.now()).toISOString(), text });
    log('COMMENT_ADD', `${id}: ${text.slice(0, 60)}`);
    emit('incidents');
  };

  // ---------- телеметрия: подпись, дедупликация A-5, авто-инцидент A-3, зависшие датчики A-4 ----------
  const fmtV = (v) => (v === null || v === undefined || v === '' ? '' : String(Number(v)));
  // КАНОНИЧЕСКАЯ СТРОКА для подписи: event_id|time|location|indicator|value (поля через «|», значение без лишних нулей: 29.0 → 29).
  // Датчик и шлюз должны строить её абсолютно одинаково, иначе подписи не совпадут. Тот же формат в backend/sc_backend.py.
  const canonical = (e) => [e.event_id, e.time, e.location, e.indicator, fmtV(e.value)].join('|');
  // Подпись события = HMAC-SHA256(секретный ключ датчика, каноническая строка). В реальности это делает ПРОШИВКА датчика,
  // а не пользователь; в прототипе подпись ставит «Стенд датчиков». ВАЖНО: ключ здесь демонстрационный (в браузере секрет
  // хранить нельзя). В продакшне ключ берётся из переменной окружения SENSOR_HMAC_SECRET на сервере.
  S.signEvent = (e) => U.hmacSha256Hex(SENSOR_KEY, canonical(e)); // это делает «прошивка датчика», а не пользователь
  // Экспорт канонической строки (для тестов и стенда)
  S.canonical = canonical;

  // Классификация нового значения датчика относительно нормы [lo; hi]:
  //   ИЗМЕНЕНО (как в indicators.csv): норма — [norm_min; norm_max), нижняя граница входит, верхняя уже нет;
  //   вышли за границу, но не более чем на 20% ширины диапазона → WARNING; дальше → CRITICAL.
  //   Пример (температура, норма 20–26): 20 → NORMAL, 26 → WARNING (так в файле), 27 → WARNING, 28 → CRITICAL.
  // Для показаний ИЗ ФАЙЛА статус не пересчитывается — берётся как в indicators.csv.
  function classify(v, lo, hi) {
    if (v >= lo && v < hi) return 'NORMAL'; // ИЗМЕНЕНО: было v <= hi; ровно norm_max в indicators.csv помечен WARNING
    // dev — на сколько значение вышло за границу нормы (в единицах показателя).
    const dev = v < lo ? lo - v : v - hi;
    return dev > 0.2 * (hi - lo) ? 'CRITICAL' : 'WARNING';
  }
  // Отклонение входящего события датчика: увеличивает счётчик «отклонено», пишет TELEMETRY_REJECTED в системный журнал
  // и бросает ScError с кодом (SENSOR_SIGNATURE_INVALID, UNKNOWN_LOCATION, EVENT_REPLAY ...). Показание в базу НЕ попадает.
  function reject(code, msg, evt) {
    state.tstats.rejected++;
    log('TELEMETRY_REJECTED', `${code}: ${msg} [${evt.location}/${evt.indicator}, ${evt.event_id || 'без event_id'}]`, 'WARN', 'sensor-gateway');
    emit('logs');
    throw new ScError(code, msg);
  }
  // Создаёт алерт (CRITICAL по датчику / STALE / OVERDUE по просрочке)
  function newAlert(p) {
    const a = { alert_id: `alr_${pad(++state.seq.alert)}`, incident_id: '', event_id: '', ...p };
    state.alerts.push(a);
    return a;
  }
  // ШЛЮЗ ТЕЛЕМЕТРИИ — вход для событий датчиков {event_id, time, location, indicator, value, signature}.
  // Порядок проверок (при любой неудаче событие отклоняется функцией reject и не сохраняется):
  //   1) подпись есть и верна — HMAC-SHA256, сравнение за постоянное время (SENSOR_SIGNATURE_INVALID);
  //   2) участок есть в sites.csv (UNKNOWN_LOCATION);  3) показатель известен (UNKNOWN_INDICATOR);
  //   4) event_id не повторялся (EVENT_REPLAY — защита от повторной отправки перехваченного события);  5) время и значение корректны.
  // Дальше правила:
  //   A-5: тот же датчик в пределах 5 минут от прошлого показания → запись со статусом DUPLICATE, алерт НЕ создаётся;
  //   CRITICAL → создаётся алерт; A-3: если предыдущее показание тоже CRITICAL и прошло не более 15 минут → авто-инцидент
  //   (source=auto, не создаётся второй, пока по этому участку и типу есть незакрытый). Возвращает {status, reading_status, alert, incident}.
  S.ingestTelemetry = (evt) => {
    evt = evt || {};
    // ШАГ 1. Подпись: отсутствует — сразу отказ (SENSOR_SIGNATURE_INVALID).
    if (typeof evt.signature !== 'string' || !evt.signature) reject('SENSOR_SIGNATURE_INVALID', 'подпись отсутствует', evt);
    // ШАГ 2. Считаем эталонную подпись по канонической строке и сравниваем за постоянное время (не через ===, чтобы нельзя было подобрать подпись по времени ответа).
    const expected = U.hmacSha256Hex(SENSOR_KEY, canonical(evt));
    if (!U.safeEqual(expected, evt.signature.toLowerCase())) reject('SENSOR_SIGNATURE_INVALID', 'подпись не совпадает', evt);
    // ШАГ 3. Подпись верна — проверяем смысл события: участок из sites.csv, известный показатель, уникальный event_id, корректные время и значение.
    const loc = evt.location, ind = evt.indicator;
    if (!state.locations.some((l) => l.id === loc)) reject('UNKNOWN_LOCATION', `участок ${loc} отсутствует в справочнике sites`, evt);
    const th = state.thresholds[ind];
    if (!th) reject('UNKNOWN_INDICATOR', String(ind), evt);
    if (typeof evt.event_id !== 'string' || !evt.event_id) reject('INVALID_EVENT', 'нет event_id', evt);
    if (state.seen[evt.event_id]) reject('EVENT_REPLAY', `event_id ${evt.event_id} уже обработан`, evt);
    const t = new Date(evt.time).getTime();
    if (isNaN(t)) reject('INVALID_EVENT', 'некорректное время', evt);
    if (evt.value === null || evt.value === '' || typeof evt.value === 'boolean' || !isFinite(Number(evt.value))) reject('INVALID_EVENT', 'некорректное значение', evt);
    const v = Number(evt.value);

    // ШАГ 4. Событие прошло все проверки: запоминаем event_id (защита от повтора), считаем статус по норме и находим предыдущее валидное показание этого датчика.
    state.seen[evt.event_id] = 1;
    const key = loc + '|' + ind;
    const iso = new Date(t).toISOString();
    const status = classify(v, th.min, th.max);
    const valid = state.readings.filter((r) => r.src !== 'sim' && r.location === loc && r.indicator === ind && r.status !== 'DUPLICATE' && r.status !== 'STALE' && r.value != null);
    // prev — предыдущее настоящее показание (не DUPLICATE, не STALE, не «живая» точка симуляции): на него опираются правила A-5 и A-3.
    const prev = valid.length ? valid[valid.length - 1] : null;
    const prevT = prev ? new Date(prev.time).getTime() : 0;
    state.live[key] = Math.max(state.live[key] || 0, t); // любое событие = датчик жив

    // ШАГ 5.
    // A-5: дубликат — то же location+indicator в пределах 5 минут (граница включена)
    if (prev && Math.abs(t - prevT) <= DEDUP_MS) {
      state.readings.push({ time: iso, location: loc, indicator: ind, value: v, norm_min: th.min, norm_max: th.max, status: 'DUPLICATE', event_id: evt.event_id });
      state.tstats.duplicate++;
      log('TELEMETRY_DUPLICATE', `${loc}/${ind}: повтор в пределах 5 мин — алерт не создан (A-5)`, 'INFO', 'sensor-gateway');
      emit('telemetry');
      return { status: 'DUPLICATE', reading_status: 'DUPLICATE', alert: null, incident: null };
    }

    state.readings.push({ time: iso, location: loc, indicator: ind, value: v, norm_min: th.min, norm_max: th.max, status, event_id: evt.event_id });
    state.readings.sort((a, b) => a.time.localeCompare(b.time));
    state.tstats.accepted++;

    // ШАГ 6. Если по этому датчику была отмечена «зависка» (A-4), то пришедшее событие означает, что датчик ожил — закрываем тот алерт (RESOLVED).
    if (state.staleOpen[key]) { // датчик «ожил»
      const a = state.alerts.find((x) => x.alert_id === state.staleOpen[key]);
      if (a) { audit('alert', a.alert_id, 'status_changed', a.status, 'RESOLVED', 'данные возобновились', { actor: 'sensor-gateway' }); a.status = 'RESOLVED'; }
      delete state.staleOpen[key];
    }

    // ШАГ 7. Алерты и авто-инциденты создаются ТОЛЬКО для CRITICAL (NORMAL и WARNING алерта не дают).
    let alert = null, incident = null;
    if (status === 'CRITICAL') {
      alert = newAlert({ location: loc, indicator: ind, level: 'CRITICAL', value: v, time: iso, status: 'OPEN', event_id: evt.event_id });
      audit('alert', alert.alert_id, 'created', null, 'OPEN', `${ind}=${fmtV(v)}`, { actor: 'sensor-gateway' });
      // Условие A-3: предыдущее показание тоже CRITICAL и интервал между ними не больше 15 минут (а дубликаты в 5 минут сюда не доходят — отсечены выше).
      // A-3: 2 подряд CRITICAL в окне 15 минут → авто-инцидент
      if (prev && prev.status === 'CRITICAL' && t - prevT >= 0 && t - prevT <= CRIT_MS) {
        const type = D.INDICATOR_TYPE[ind] || 'other';
        // Защита от лавины: если по этому участку и типу уже есть НЕзакрытый инцидент — новый не создаём, а привязываем алерты к нему.
        incident = state.incidents.find((i) => i.location === loc && i.type === type && i.status !== 'CLOSED') || null;
        if (!incident) {
          incident = newIncident({ type, location: loc, description: `Авто (A-3): 2 подряд CRITICAL по показателю «${D.indLabel(ind)}»`, source: 'auto', alert_id: alert.alert_id });
          audit('incident', incident.incident_id, 'created', null, 'NEW', 'source=auto (A-3)', { actor: 'system' });
          log('INCIDENT_AUTO', `${incident.incident_id} создан по правилу A-3 (${loc}/${ind})`, 'WARN', 'system');
        }
        // Все открытые алерты этого датчика переходят в статус INCIDENT и получают ссылку на инцидент (в аудит пишется каждый переход).
        state.alerts.filter((a) => a.location === loc && a.indicator === ind && a.status === 'OPEN').forEach((a) => {
          audit('alert', a.alert_id, 'status_changed', 'OPEN', 'INCIDENT', `привязан к ${incident.incident_id}`, { actor: 'system' });
          a.status = 'INCIDENT'; a.incident_id = incident.incident_id;
        });
      }
    }
    emit('telemetry');
    if (incident) emit('incidents');
    return { status: 'ACCEPTED', reading_status: status, alert, incident };
  };

  // ПРАВИЛО A-4 (зависшие датчики). Для каждого датчика, от которого в этом сеансе приходили события, смотрим, когда было последнее.
  // Прошло СТРОГО больше 5 минут (по времени системы) и простой ещё не отмечен → добавляем показание STALE, создаём алерт
  // (статус ESCALATED) и эскалацию руководителю — один раз на простой. Когда данные вернутся, алерт станет RESOLVED.
  // Вызывается раз в секунду при запущенной симуляции и вручную кнопкой на стенде.
  S.checkStale = () => {
    const now = U.now();
    let n = 0;
    for (const [key, last] of Object.entries(state.live)) {
      // Пропускаем датчик, если простой уже отмечен ИЛИ тишина не дольше 5 минут (граница включена: ровно 5:00 — ещё не зависший).
      if (state.staleOpen[key] || now - last <= STALE_MS) continue;
      const [loc, ind] = key.split('|');
      const th = state.thresholds[ind];
      const iso = new Date(now).toISOString();
      const mins = Math.floor((now - last) / 60000);
      state.readings.push({ time: iso, location: loc, indicator: ind, value: null, norm_min: th.min, norm_max: th.max, status: 'STALE', event_id: '' });
      // Создаём алерт STALE со статусом ESCALATED и эскалацию на ВСЕХ активных руководителей; в аудит пишет 'system'.
      const al = newAlert({ location: loc, indicator: ind, level: 'STALE', value: null, time: iso, status: 'ESCALATED' });
      audit('alert', al.alert_id, 'created', null, 'ESCALATED', `нет данных ${mins} мин (A-4)`, { actor: 'system' });
      const to = state.users.filter((u) => u.role === 'manager' && u.active).map((u) => u.id);
      state.escalations.push({ escalation_id: `esc_${pad(++state.seq.esc)}`, alert_id: al.alert_id, location: loc, indicator: ind, to, time: iso, reason: `нет данных ${mins} мин`, ack: false });
      state.staleOpen[key] = al.alert_id;
      log('SENSOR_STALE', `${loc}/${ind}: нет данных ${mins} мин — эскалация руководителю (A-4)`, 'WARN', 'system');
      n++;
    }
    if (n) emit('telemetry');
    return n;
  };
  // Руководитель подтверждает эскалацию
  S.ackEscalation = (id) => {
    guard('escalations.view');
    const e = state.escalations.find((x) => x.escalation_id === id);
    if (!e) throw new Error('Эскалация не найдена');
    zoneGuard(e.location);
    if (e.ack) return;
    e.ack = true;
    const a = state.alerts.find((x) => x.alert_id === e.alert_id);
    if (a && a.status === 'ESCALATED') { audit('alert', a.alert_id, 'status_changed', 'ESCALATED', 'ACKNOWLEDGED', 'эскалация принята руководителем'); a.status = 'ACKNOWLEDGED'; }
    log('ESCALATION_ACK', `${id} подтверждена`);
    emit('telemetry');
  };

  // ПРОСРОЧКА ИНЦИДЕНТОВ. Проходит по всем видимым (по времени) инцидентам:
  //   срок истёк и инцидент не CLOSED → создаём алерт уровня OVERDUE (один на инцидент), запись в аудит и в системный журнал,
  //   показываем уведомление; инцидент закрыт или время перемотали назад до срока → алерт получает статус RESOLVED.
  // Статус жизненного цикла НЕ меняется: «просрочен» — вычисляемое состояние (см. S.isOverdue), а не пятый статус.
  S.checkOverdue = () => {
    const now = U.now(), iso = new Date(now).toISOString();
    let raised = 0, solved = 0;
    for (const inc of state.incidents) {
      if (!seenIncident(inc)) continue;
      const open = state.alerts.find((a) => a.level === 'OVERDUE' && a.incident_id === inc.incident_id && a.status === 'OPEN');
      // over — инцидент сейчас просрочен (не закрыт и срок меньше текущего времени системы); open — уже есть открытый алерт просрочки по нему.
      const over = inc.status !== 'CLOSED' && new Date(inc.deadline).getTime() < now;
      // Просрочка наступила, а алерта ещё нет → создаём (ровно один на инцидент, чтобы не плодить дубли каждую секунду).
      if (over && !open) {
        const al = newAlert({ location: inc.location, indicator: '', level: 'OVERDUE', value: null, time: iso, status: 'OPEN', incident_id: inc.incident_id });
        audit('alert', al.alert_id, 'created', null, 'OPEN', `${inc.incident_id} просрочен (дедлайн ${inc.deadline})`, { actor: 'system' });
        log('INCIDENT_OVERDUE', `${inc.incident_id}: срок ${U.fmtDT(inc.deadline)} истёк, инцидент не закрыт`, 'WARN', 'system');
        if (S.canSee(inc.location)) raised++;
      // Тревога больше не актуальна (инцидент закрыт либо время перемотали назад) → снимаем алерт.
      } else if (!over && open) {
        audit('alert', open.alert_id, 'status_changed', 'OPEN', 'RESOLVED', inc.status === 'CLOSED' ? 'инцидент закрыт' : 'время перемотано до срока', { actor: 'system' });
        open.status = 'RESOLVED';
        solved++;
      }
    }
    // Уведомление одно на пачку: при перемотке вперёд просрочек может быть десятки — показываем число, а не десятки окон.
    if (raised) U.toast(raised === 1 ? '⏰ Инцидент просрочен: срок 4 часа истёк' : `⏰ Просрочено инцидентов: ${raised}`, 'error');
    if (raised || solved) { emit('telemetry'); emit('incidents'); }
    return raised;
  };
  // Открытые алерты просрочки для баннера
  S.overdueAlerts = () => state.alerts.filter((a) => a.level === 'OVERDUE' && a.status === 'OPEN' && S.canSee(a.location) && seenIncident(findIncSafe(a.incident_id)));
  // Поиск инцидента без исключения (для фильтра алертов)
  const findIncSafe = (id) => state.incidents.find((x) => x.incident_id === id) || { source: 'manual' };

  // ---------- симуляция: запуск/пауза, скорость, позиция (перемотка вперёд и назад) ----------
  S.simRunning = false;
  // Кнопка ▶/⏸ в шапке: запускает или останавливает ход ВРЕМЕНИ СИСТЕМЫ. Пока время идёт, раз в секунду срабатывают
  // проверки просрочки и «зависших» датчиков, а у датчиков появляются новые точки графиков (liveTick).
  S.setSimulation = (on) => { U.setRunning(on); S.simRunning = on; S.syncSim(true); };
  // Границы шкалы времени симуляции: от первого инцидента до последней записи/дедлайна в данных
  S.simRange = () => {
    let a = Infinity, z = -Infinity;
    for (const i of state.incidents) { if (i.source !== 'file') continue; a = Math.min(a, +new Date(i.time)); z = Math.max(z, +new Date(i.deadline), +new Date(i.time)); }
    for (const r of state.readings) if (r.src === 'file') z = Math.max(z, +new Date(r.time));
    return { start: isFinite(a) ? a : U.now(), end: isFinite(z) ? z : U.now() };
  };
  // ПЕРЕМОТКА: ставит время системы на момент ms, но не раньше первого инцидента и не позже конца данных (S.simRange).
  // После перемотки сразу пересчитывается, какие инциденты/показания «уже случились», перерисовываются графики и тревоги.
  // Перемотка назад скрывает будущие данные из файла и снимает тревоги просрочки, срок которых ещё не наступил.
  S.seek = (ms) => {
    const { start, end } = S.simRange();
    U.setBase(Math.min(Math.max(ms, start), end));
    S.syncSim(true);
  };
  // Перемотка на ± интервал (кнопки −1 ч, +10 мин ...)
  S.seekBy = (deltaMs) => S.seek(U.now() + deltaMs);
  let simSig = '';
  // «Такт» симуляции. Порядок: 1) если время идёт — добавить живые точки графиков; 2) проверить просрочки;
  // 3) перерисовать интерфейс, только если изменилось число видимых инцидентов/показаний/просрочек (иначе экран бы
  // перерисовывался каждую секунду и сбрасывал открытые выпадающие списки). force=true — перерисовать в любом случае.
  S.syncSim = (force) => {
    if (S.simRunning) S.liveTick();
    S.checkOverdue();
    const sig = state.incidents.filter(seenIncident).length + '|' + state.readings.filter(seenReading).length + '|' + state.incidents.filter((i) => S.isOverdue(i) && seenIncident(i)).length;
    if (force || sig !== simSig) { simSig = sig; emit('telemetry'); emit('incidents'); }
  };


  // «Живые» графики: пока симуляция идёт, каждый датчик, по которому уже были показания, выдаёт новую точку каждые 5 мин
  // системного времени. Значение — небольшой дрейф от последнего показания, статус не меняется (норма остаётся нормой,
  // предупреждение — предупреждением). Эти точки только для отображения (src='sim'): алертов, инцидентов и записей аудита
  // они не создают, в реестр данных и выгрузки не попадают. Инциденты по датчикам создаёт только правило A-3 по подписанным событиям.
  const SIM_STEP = 5 * 60000, SIM_MAX = 3000;
  const DEC = { temperature: 2, ventilation: 2, humidity: 1 };
  // «ЖИВЫЕ» ГРАФИКИ. В файле indicators.csv показаний мало (6–7 точек на датчик), поэтому пока симуляция идёт, каждый датчик,
  // по которому уже были показания, получает новую точку каждые 5 минут времени системы:
  // значение = последнее значение + небольшой случайный дрейф, СТАТУС НЕ МЕНЯЕТСЯ (норма остаётся нормой).
  // Точки помечены src='sim' и нужны ТОЛЬКО для отображения: они не создают алертов, инцидентов и записей аудита,
  // не попадают в реестр/экспорт и не участвуют в правилах A-3/A-5. Если у датчика нет данных (STALE) — ничего не выдумываем.
  S.liveTick = () => {
    const now = U.now();
    state.simTick = state.simTick || {};
    let added = 0;
    for (const loc of state.locations) {
      for (const [ind, th] of Object.entries(state.thresholds)) {
        const key = loc.id + '|' + ind;
        const hist = state.readings.filter((r) => r.location === loc.id && r.indicator === ind && r.status !== 'DUPLICATE' && seenReading(r));
        const last = hist[hist.length - 1];
        if (!last || last.value == null || last.status === 'STALE') continue; // нет данных — не выдумываем
        const from = Math.max(state.simTick[key] || 0, new Date(last.time).getTime());
        // t — последняя 5-минутная отметка времени, не позже «сейчас»; новые точки добавляются только после последней имеющейся (from).
        let t = Math.floor(now / SIM_STEP) * SIM_STEP;
        if (t <= from) continue;
        const ticks = [];
        // Не больше 3 точек за раз: при быстрой перемотке (минуты→часы) не создаём тысячи точек, берём только самые свежие.
        for (; t > from && ticks.length < 3; t -= SIM_STEP) ticks.unshift(t); // при быстрой перемотке — только последние точки
        let v = last.value;
        const lo = last.norm_min, hi = last.norm_max, span = hi - lo, d = DEC[ind] != null ? DEC[ind] : 2;
        for (const tt of ticks) {
          let nv = v;
          // Пробуем до 6 раз подобрать значение так, чтобы статус остался прежним; не получилось — повторяем прошлое значение.
          for (let k = 0; k < 6; k++) { // подбираем шаг так, чтобы статус не менялся
            const cand = Number((v + (Math.random() - 0.5) * span * 0.08).toFixed(d));
            if (classify(cand, lo, hi) === last.status) { nv = cand; break; }
          }
          v = nv;
          state.readings.push({ time: new Date(tt).toISOString(), location: loc.id, indicator: ind, value: v, norm_min: lo, norm_max: hi, status: last.status, src: 'sim' });
          added++;
        }
        state.simTick[key] = ticks[ticks.length - 1];
      }
    }
    if (added) {
      state.readings.sort((a, b) => a.time.localeCompare(b.time));
      const sims = state.readings.filter((r) => r.src === 'sim');
      // Предохранитель: хранится не больше SIM_MAX «живых» точек (самые старые удаляются), чтобы localStorage не разрастался.
      if (sims.length > SIM_MAX) { const drop = new Set(sims.slice(0, sims.length - SIM_MAX)); state.readings = state.readings.filter((r) => !drop.has(r)); }
    }
    return added;
  };

  // ---------- администрирование ----------
  // Разбор строки «Зоны» из формы сотрудника: 'zone_A, zone_B' или '*'. Неизвестная зона → ошибка. Админ и руководитель всегда '*'.
  function parseZones(txt, role) {
    if (role === 'admin' || role === 'manager') return '*';
    const t = String(txt || '').trim();
    if (t === '*') return '*';
    const list = t.split(/[,;\s]+/).filter(Boolean), known = S.zones();
    for (const z of list) if (!known.includes(z)) throw new Error(`Неизвестная зона: ${z} (есть: ${known.join(', ')})`);
    return [...new Set(list)];
  }
  // Разбор строки «Участки» из формы сотрудника (за какие участки он отвечает). Каждый участок должен существовать в справочнике
  // и входить в зоны сотрудника — нельзя быть ответственным за участок, к которому нет доступа.
  function parseSites(txt, zones) {
    const t = Array.isArray(txt) ? txt.join(',') : String(txt || '').trim();
    if (t === '*') { if (zones !== '*') throw new Error('«*» в участках допустимо только при доступе ко всем зонам'); return '*'; }
    const list = [...new Set(t.split(/[,;\s]+/).filter(Boolean))];
    for (const id of list) {
      const loc = state.locations.find((l) => l.id === id);
      if (!loc) throw new Error(`Неизвестный участок: ${id} (есть: ${state.locations.map((l) => l.id).join(', ')})`);
      if (zones !== '*' && !zones.includes(loc.zone)) throw new Error(`Участок ${id} вне зон сотрудника`);
    }
    return list;
  }
  // Создание/редактирование сотрудника (право users.manage — только администратор). Поля: name (ФИО целиком: Фамилия Имя Отчество),
  // login (уникален), role, zones, sites, active. Защиты: нельзя убрать/отключить последнего администратора и нельзя менять роль
  // или отключать самого себя. Новый id выдаётся по порядку (e_106, e_107 ...).
  S.saveUser = (u) => {
    guard('users.manage');
    const name = String(u.name || '').trim(), login = String(u.login || '').trim();
    if (!name || !login) throw new Error('Укажите ФИО и логин');
    if (!PERMS[u.role]) throw new Error('Неверная роль');
    if (state.users.some((x) => x.login === login && x.id !== u.id)) throw new Error('Логин уже занят');
    const zones = parseZones(u.zones, u.role);
    const sites = parseSites(u.sites, zones);
    const active = u.active !== false;
    if (u.id) {
      const cur = state.users.find((x) => x.id === u.id);
      if (!cur) throw new Error('Пользователь не найден');
      // Защита от самоблокировки системы: в ней всегда должен оставаться хотя бы один активный администратор.
      const admins = state.users.filter((x) => x.role === 'admin' && x.active && x.id !== cur.id);
      if (cur.role === 'admin' && (u.role !== 'admin' || !active) && !admins.length) throw new Error('Нельзя убрать последнего администратора');
      if (cur.id === state.session.userId && (u.role !== cur.role || !active)) throw new Error('Нельзя менять роль или отключать самого себя');
      Object.assign(cur, { name, login, role: u.role, active, zones, sites });
      delete cur.position;
      log('USER_UPDATE', `${cur.id} ${name} (${D.ROLES[cur.role]}, ${S.zonesLabel(cur)}${active ? '' : ', отключён'})`);
    } else {
      const n = state.users.reduce((m, x) => Math.max(m, parseInt(x.id.replace(/\D/g, ''), 10) || 0), 105) + 1;
      const id = 'e_' + pad(n);
      state.users.push({ id, name, login, role: u.role, active, zones, sites });
      log('USER_CREATE', `${id} ${name} (${D.ROLES[u.role]})`);
    }
    emit('admin');
  };
  // Добавление участка в справочник (админ)
  S.addLocation = (id, name, zone) => {
    guard('directory.manage');
    id = String(id || '').trim(); name = String(name || '').trim(); zone = String(zone || '').trim();
    if (!/^site_\d{2,}$/.test(id)) throw new Error('Код участка должен иметь вид site_06');
    if (!/^zone_[A-Za-z0-9]+$/.test(zone)) throw new Error('Укажите зону вида zone_D');
    if (!name) throw new Error('Укажите название участка');
    if (state.locations.some((l) => l.id === id)) throw new Error('Такой участок уже есть');
    state.locations.push({ id, name, zone });
    log('LOCATION_ADD', `${id} — ${name} (${zone})`);
    emit('directory');
  };
  // Следующий свободный код участка (site_06 ...)
  S.nextLocationId = () => {
    const n = state.locations.reduce((m, l) => Math.max(m, parseInt(l.id.replace(/\D/g, ''), 10) || 0), 0) + 1;
    return 'site_' + pad(n, 2);
  };
  // СБРОС рабочих данных к исходным файлам CSV (кнопка в «Реестре данных»). Инциденты, показания, алерты и часы начинаются заново.
  // Журнал АУДИТА и список обработанных event_id сохраняются — аудит стирать нельзя даже при сбросе.
  S.resetData = () => {
    guard('users.manage');
    const role = state.session.role;
    // Сохраняем то, что стирать нельзя: журнал аудита, список обработанных event_id и счётчики телеметрии.
    const keep = { audit: state.audit, seen: state.seen, tstats: state.tstats }; // аудит и защита от повторов переживают сброс
    // Всё остальное (инциденты, показания, пользователи, алерты) пересобираем из исходных CSV.
    state = D.createStateFromFiles();
    state.audit = keep.audit; state.seen = keep.seen; state.tstats = keep.tstats;
    state.alerts = []; state.escalations = []; state.simTick = {}; state.live = {}; state.staleOpen = {}; state.seq.alert = 0; state.seq.esc = 0;
    state.session.role = role;
    initClock(); S.simRunning = false;
    log('DATA_RESET', 'Рабочие данные сброшены к файлам; журнал аудита сохранён (append-only)', 'WARN');
    S.setRole(role);
  };

  // ---------- CSV ----------
  const INC_COLS = ['incident_id', 'type', 'location', 'time', 'responsible', 'status', 'deadline'];
  const AUD_COLS = ['event_id', 'entity_type', 'entity_id', 'action', 'from_status', 'to_status', 'actor', 'at', 'ip', 'details', 'prev_hash', 'hash'];
  // Выгрузки CSV (форматы совпадают с исходными файлами)
  S.exportIncidentsCSV = () => { guard('registry.view'); return U.toCSV(state.incidents, INC_COLS); };
  S.exportIndicatorsCSV = () => { guard('registry.view'); return D.RAW.indicators; };
  S.exportSitesCSV = () => { guard('registry.view'); return U.toCSV(state.locations.map((l) => ({ site_id: l.id, name: l.name, zone: l.zone })), ['site_id', 'name', 'zone']); };
  S.exportAuditCSV = () => { guard('audit.view'); return U.toCSV(state.audit, AUD_COLS); };
  // ИМПОРТ incidents.csv (администратор). Каждая строка проверяется: корректные поля, участок есть в sites.csv.
  // Импорт НЕ обходит жизненный цикл: у существующего инцидента статус меняется только по разрешённым переходам (иначе строка пропускается).
  // Статус NEW с указанным ответственным трактуется как ASSIGNED (см. D.normalizeIncident). Каждое изменение пишется в аудит.
  S.importIncidentsCSV = (text) => {
    guard('users.manage');
    const rows = U.parseCSV(text);
    let added = 0, updated = 0, skipped = 0;
    for (const r of rows) {
      const ok = r.incident_id && D.TYPES[r.type] && D.STATUSES.includes(r.status) && !isNaN(new Date(r.time)) && !isNaN(new Date(r.deadline));
      if (!ok) { skipped++; continue; }
      const i = state.incidents.findIndex((x) => x.incident_id === r.incident_id);
      // импорт не должен обходить жизненный цикл: статус существующего инцидента меняется только по разрешённым переходам
      // Сравниваем уже НОРМАЛИЗОВАННЫЙ статус, иначе повторный импорт исходного файла пропускал бы все строки NEW+ответственный.
      const wantStatus = D.normalizeIncident({ status: r.status, responsible: r.responsible }).status; // статус с учётом нормализации (NEW + ответственный → ASSIGNED)
      if (i >= 0 && wantStatus !== state.incidents[i].status && !ALLOWED[state.incidents[i].status].includes(wantStatus)) { skipped++; continue; }
      if (!state.locations.some((l) => l.id === r.location)) { skipped++; continue; } // участок должен быть в справочнике sites
      const rec = D.normalizeIncident({ incident_id: r.incident_id, type: r.type, location: r.location, time: new Date(r.time).toISOString(), responsible: r.responsible || '', status: r.status, deadline: new Date(r.deadline).toISOString(), description: r.description || '', source: 'import' }); // закрывающая скобка normalizeIncident
      if (i >= 0) {
        const from = state.incidents[i].status;
        state.incidents[i] = { ...state.incidents[i], ...rec };
        if (from !== r.status) audit('incident', r.incident_id, r.status === 'CLOSED' ? 'closed' : 'status_changed', from, r.status, 'импорт CSV');
        updated++;
      } else {
        state.incidents.push({ related_to: '', alert_id: '', ...rec });
        audit('incident', r.incident_id, 'created', null, r.status, 'импорт CSV');
        added++;
      }
      const n = parseInt(r.incident_id.replace(/\D/g, ''), 10);
      if (n > state.seq.incident) state.seq.incident = n;
    }
    log('CSV_IMPORT', `incidents.csv: добавлено ${added}, обновлено ${updated}, пропущено ${skipped}`);
    emit('admin');
    return { added, updated, skipped };
  };
})();

/* ===== js/views/dispatcher.js ===== */
(function () {
  const SC = window.SC, U = SC.utils, D = SC.data, S = SC.store;
  const V = (SC.views = SC.views || {});
  const esc = U.esc;
  const RANK = { NORMAL: 0, NODATA: 1, STALE: 1, WARNING: 2, CRITICAL: 3 };
  // Значение + единица для плиток датчиков («21.9 °C»)
  const fmtV = (v, unit) => (v == null ? '—' : v + (unit ? ' ' + unit : ''));

  // Рисует мини-график (SVG polyline) последних показаний датчика; зелёная полоса — диапазон нормы.
  // Масштаб по вертикали подстраивается под данные, поэтому график «дышит» при появлении новых точек.
  function spark(s) {
    const w = 120, h = 34, vals = s.history.map((x) => x.v).filter((v) => v != null);
    if (vals.length < 2 || s.min == null) return `<svg class="spark" viewBox="0 0 ${w} ${h}"></svg>`;
    const lo = Math.min(s.min, ...vals), hi = Math.max(s.max, ...vals), pad = (hi - lo) * 0.08 || 1;
    const y = (v) => (h - ((v - (lo - pad)) / (hi - lo + 2 * pad)) * h).toFixed(1);
    const pts = vals.map((v, i) => `${((i / Math.max(vals.length - 1, 1)) * w).toFixed(1)},${y(v)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <rect x="0" y="${y(s.max)}" width="${w}" height="${Math.max(y(s.min) - y(s.max), 0)}" class="band"/>
      <polyline points="${pts}" class="line"/></svg>`;
  }

  // ЭКРАН ДИСПЕТЧЕРА (его же использует руководитель — у него дополнительно видны эскалации и аудит).
  // mount() строит страницу, внутри — функции render*() для каждого блока; refresh(тема) перерисовывает только нужные блоки,

  V.dispatcher = {

        </section>

        </section>

        <section class="panel" data-sec="audit"></section>
        <dialog data-sec="dlg"></dialog>`;
      const $ = (n) => root.querySelector(`[data-sec="${n}"]`);

          <select data-f="location"><option value="">Все участки</option>${S.visibleLocations().map((l) => opt(l.id, l.id + ' — ' + l.name, f.location)).join('')}</select>

          <input data-f="q" type="search" placeholder="Поиск: ID, описание…" value="${esc(f.q)}">

            <ul>${crit.map((s) => `<li><b>${esc(s.location)}</b> · ${esc(s.label)}: <b>${fmtV(s.value, s.unit)}</b> <span class="muted">(норма ${s.min}–${s.max}${s.value != null ? ', ' + (s.value > s.max ? 'выше' : 'ниже') : ''})</span></li>`).join('')}</ul></div>`;
        }

            <ul>${od.slice(0, 8).map((a) => { const i = S.listIncidents().find((x) => x.incident_id === a.incident_id); return i ? `<li><b>${esc(i.incident_id)}</b> · ${esc(D.TYPES[i.type] || i.type)} · ${esc(i.location)} <span class="muted">(срок был ${U.fmtDT(i.deadline)}${i.responsible ? ', ответственный: ' + esc(S.userName(i.responsible)) : ', ответственный не назначен'})</span></li>` : ''; }).join('')}${od.length > 8 ? `<li class="muted">…и ещё ${od.length - 8} (полный список — в реестре инцидентов ниже, метка «Просрочен»)</li>` : ''}</ul></div>`;
