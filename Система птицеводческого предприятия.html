<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ситуационный центр — птицеводческое предприятие</title>
<style>
/* тёмная графитовая тема, статусные цвета: зелёный/жёлтый/красный/серый */
:root {
  --bg: #16181b; --panel: #1f2226; --panel2: #262a2f; --line: #33383e; --text: #e6e8eb; --muted: #8b939c;
  --ok: #3fb67a; --warn: #e5a93d; --bad: #e5534b; --info: #4c9aff; --accent: #8fa3b8; --stale: #7a828b;
  --radius: 10px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
h2 { margin: 0; font-size: 16px; } h3 { margin: 0 0 8px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .nowrap { white-space: nowrap; }
.bad-t { color: var(--bad); font-weight: 600; }

.app-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 10px 20px; background: #101215; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; } .brand small { display: block; color: var(--muted); font-size: 11px; } .logo { font-size: 26px; }
.roles { display: flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: 999px; margin: 0 auto; }
.role-btn { border: 0; background: transparent; color: var(--muted); padding: 7px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.role-btn:hover { color: var(--text); } .role-btn.on { background: var(--accent); color: #11161b; font-weight: 600; }
.hdr-right { display: flex; align-items: center; gap: 12px; } .who { color: var(--muted); font-size: 12px; } .clock { font-variant-numeric: tabular-nums; color: var(--muted); }
.app-main { padding: 18px 20px 40px; max-width: 1500px; margin: 0 auto; }
.view > * + * { margin-top: 16px; }

select, input, textarea { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: inherit; max-width: 100%; }
textarea { width: 100%; resize: vertical; } input.num { width: 90px; }
select:disabled, input:disabled { opacity: .55; } option:disabled { color: #666; }
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; cursor: pointer; font: inherit; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #11161b; border-color: var(--accent); font-weight: 600; }
.btn.success { background: var(--ok); color: #08140e; border-color: var(--ok); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: #5b2b28; } .btn.ghost { background: transparent; } .btn.sm { padding: 4px 9px; font-size: 12px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.filters, .inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; } .inline-form { margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 24px; } @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; }
.kpi b { font-size: 28px; display: block; } .kpi span { color: var(--muted); font-size: 12px; }
.kpi.bad { border-left-color: var(--bad); } .kpi.warn { border-left-color: var(--warn); } .kpi.ok { border-left-color: var(--ok); } .kpi.stale { border-left-color: var(--stale); }
.alert-banner { background: #2a1819; border: 1px solid var(--bad); border-radius: var(--radius); padding: 12px 16px; animation: glow 2s infinite; }
.alert-title { font-weight: 700; color: #ff8a83; display: flex; align-items: center; gap: 8px; } .alert-banner ul { margin: 8px 0 0; padding-left: 22px; } .alert-banner li { margin: 3px 0; }
.alert-warn { background: #2a2314; border: 1px solid #6b5420; color: #f0c76a; border-radius: var(--radius); padding: 10px 16px; }
.alert-warn ul { margin: 6px 0 0; padding-left: 22px; color: var(--text); }
.alert-ok { background: #162219; border: 1px solid #25533b; color: #7fd6a8; border-radius: var(--radius); padding: 10px 16px; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229,83,75,.7); } 100% { box-shadow: 0 0 0 10px rgba(229,83,75,0); } }
@keyframes glow { 50% { box-shadow: 0 0 14px rgba(229,83,75,.35); } }

.sites { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
.site { background: var(--panel2); border: 1px solid var(--line); border-top: 3px solid var(--ok); border-radius: var(--radius); padding: 10px 12px; }
.site.warning { border-top-color: var(--warn); } .site.critical { border-top-color: var(--bad); } .site.stale { border-top-color: var(--stale); }
.site header { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; } .site header .badge { margin-left: auto; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tile.warning { border-color: var(--warn); } .tile.critical { border-color: var(--bad); background: #261819; } .tile.stale { border-style: dashed; border-color: var(--stale); }
.tile-l { color: var(--muted); font-size: 12px; } .tile-v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; } .tile-v small { font-size: 12px; color: var(--muted); font-weight: 400; }
.tile.critical .tile-v { color: #ff8a83; } .tile.warning .tile-v { color: var(--warn); } .tile.stale .tile-v { color: var(--stale); } .tile-n { font-size: 11px; color: var(--muted); }
.spark { width: 100%; height: 34px; display: block; } .spark .band { fill: rgba(63,182,122,.12); } .spark .line { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.tile.critical .spark .line { stroke: var(--bad); } .tile.warning .spark .line { stroke: var(--warn); }

.table-wrap { overflow: auto; } .table-wrap.tall { max-height: 480px; }
.tbl { width: 100%; border-collapse: collapse; } .tbl th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } .tbl tbody tr:hover { background: rgba(255,255,255,.025); }
.row-overdue { background: rgba(229,83,75,.08); box-shadow: inset 3px 0 0 var(--bad); } .row-closed { opacity: .6; } .row-warn { background: rgba(229,169,61,.08); }
.empty { text-align: center; color: var(--muted); padding: 26px; } .empty.big { font-size: 18px; padding: 50px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); }
.chip.warn { color: var(--warn); border-color: #5c4a1f; }
.chip.t-ventilation { color: #7cc4ff; } .chip.t-humidity { color: #6fd6d0; } .chip.t-equipment { color: #c9a0ff; } .chip.t-temperature { color: #ff9f7a; } .chip.t-other { color: var(--muted); }
.chip.role-admin { color: #ff9f7a; } .chip.role-dispatcher { color: #7cc4ff; } .chip.role-worker { color: #7fd6a8; }
.badge { padding: 2px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .3px; }
.st-normal, .st-closed { background: #173325; color: #7fd6a8; } .st-warning, .st-assigned { background: #3a2f14; color: var(--warn); }
.st-critical, .st-new { background: #3a1a18; color: #ff8a83; } .st-in_progress { background: #17304a; color: #7cc4ff; }
.st-stale { background: #2a2e33; color: #aab2bb; }
.st-duplicate { background: #2a2e33; color: #aab2bb; text-decoration: line-through; }
.chip.role-manager { color: #e8c76a; } .chip.zone { color: var(--accent); }
select.st { font-weight: 600; }

.hello { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; } .hello .tabs { margin: 0; } .tabs.big { margin-bottom: 0; }
.tab { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; font: inherit; } .tab.on { background: var(--accent); color: #11161b; font-weight: 600; border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.card.overdue { border-color: var(--bad); box-shadow: 0 0 0 1px rgba(229,83,75,.3); }
.card header { display: flex; gap: 8px; align-items: center; } .card header .badge { margin-left: auto; }
.card-loc { font-size: 16px; font-weight: 600; } .card p { margin: 4px 0; font-size: 15px; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; } .card-actions .btn { padding: 10px 14px; font-size: 15px; }
.comments { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; } .cmt { background: var(--panel2); border-radius: 8px; padding: 6px 10px; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(520px, 92vw); } dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-body { padding: 18px; display: flex; flex-direction: column; gap: 10px; } .dlg-body label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; } .dlg-body label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
.simbar { flex-basis: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; color: var(--muted); }
.simbar input[type=range] { flex: 1 1 260px; min-width: 160px; accent-color: var(--accent); } .simbar select { padding: 4px 6px; }
.simbar .sim-t { font-variant-numeric: tabular-nums; color: var(--text); min-width: 11.5em; } .simbar .sim-r { font-variant-numeric: tabular-nums; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: #2b3036; border: 1px solid var(--line); border-left: 4px solid var(--info); padding: 10px 14px; border-radius: 8px; max-width: 420px; transition: opacity .4s; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.ok { border-left-color: var(--ok); } .toast.error { border-left-color: var(--bad); } .toast.out { opacity: 0; }
</style>
</head>
